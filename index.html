TOPICS["mysql"] = [
  {num:`01`,title:`DBMS Fundamentals`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">DBMS kya hai?</div><ul class="note-list">
<li><strong>Database Management System:</strong> Data ko systematically store, retrieve aur manage karne ka software</li>
<li><strong>DBMS vs File System:</strong> Redundancy control, concurrent access, security, backup — sab DBMS handle karta hai</li>
<li><strong>Types:</strong> Relational (MySQL, PostgreSQL) | NoSQL (MongoDB) | Hierarchical | Network | Object-oriented</li>
<li><strong>RDBMS:</strong> Relational DBMS — data tables mein store hota hai rows aur columns mein</li>
<li><strong>Popular RDBMS:</strong> MySQL, PostgreSQL, Oracle, MS SQL Server, SQLite</li>
</ul></div>
<div class="card"><div class="card-title">DBMS Architecture</div>
<div class="arch-row"><div class="arch-label">External Level</div><div class="arch-val">User view — har user sirf apna relevant data dekhta hai. Views is layer pe hoti hain.</div></div>
<div class="arch-row"><div class="arch-label">Conceptual Level</div><div class="arch-val">Logical structure — tables, relationships, constraints define hote hain. DBA ka level.</div></div>
<div class="arch-row"><div class="arch-label">Internal Level</div><div class="arch-val">Physical storage — data actually kaise store ho raha hai disk pe. Indexes, file organization.</div></div>
<div class="tip-box"><p><strong>Data Independence:</strong> Physical independence = storage badlo bina logical change ke | Logical independence = schema badlo bina application change ke</p></div>
</div>
<div class="card"><div class="card-title">Keys in DBMS</div>
<div class="arch-row"><div class="arch-label">Primary Key</div><div class="arch-val">Unique + NOT NULL — ek row ko uniquely identify kare. Ek table mein sirf ek PK.</div></div>
<div class="arch-row"><div class="arch-label">Foreign Key</div><div class="arch-val">Dusre table ka PK reference karo — referential integrity maintain karo.</div></div>
<div class="arch-row"><div class="arch-label">Candidate Key</div><div class="arch-val">Sab columns jo PK ban sakte hain — minimal superkey.</div></div>
<div class="arch-row"><div class="arch-label">Composite Key</div><div class="arch-val">2+ columns milke ek row uniquely identify karein.</div></div>
<div class="arch-row"><div class="arch-label">Super Key</div><div class="arch-val">Any set of columns jo row uniquely identify kare — may have extra columns.</div></div>
<div class="arch-row"><div class="arch-label">Surrogate Key</div><div class="arch-val">System-generated artificial key — auto_increment ID. Natural meaning nahi hoti.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>DBMS aur RDBMS mein kya fark hai?</li>
<li>Primary key aur Unique key mein kya difference hai?</li>
<li>Foreign key constraint kya karta hai? Violation pe kya hota hai?</li>
<li>Candidate key aur Super key mein kya relation hai?</li>
<li>DBMS ki 3-tier architecture explain karo.</li>
<li>Surrogate key vs Natural key — kab kya prefer karoge?</li>
</ol></div>`},
  {num:`02`,title:`ACID Properties`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">ACID kya hai?</div><ul class="note-list">
<li>Transaction ke 4 properties jo data integrity guarantee karte hain</li>
<li>Bank transfer example — Rs. 1000 A se B ko transfer karo</li>
</ul></div>
<div class="card"><div class="card-title">ACID Properties Detail</div>
<div class="arch-row"><div class="arch-label">Atomicity</div><div class="arch-val">All or Nothing — ya poora transaction execute hoga ya bilkul nahi. Crash hone pe rollback.</div></div>
<div class="arch-row"><div class="arch-label">Consistency</div><div class="arch-val">Transaction ke baad DB valid state mein rahe — constraints, rules sab satisfy hone chahiye.</div></div>
<div class="arch-row"><div class="arch-label">Isolation</div><div class="arch-val">Concurrent transactions ek dusre ko affect na karein — jaisa ek ek kar ke chal rahe ho.</div></div>
<div class="arch-row"><div class="arch-label">Durability</div><div class="arch-val">Committed transaction permanently save ho — crash hone pe bhi data lost nahi hoga.</div></div>
</div>
<div class="card"><div class="card-title">Transaction Isolation Levels</div>
<div class="arch-row"><div class="arch-label">Read Uncommitted</div><div class="arch-val">Dirty reads possible — dusre uncommitted data padh sakte ho. Sabse fast, sabse unsafe.</div></div>
<div class="arch-row"><div class="arch-label">Read Committed</div><div class="arch-val">Dirty reads nahi — sirf committed data padho. Non-repeatable reads possible. Oracle default.</div></div>
<div class="arch-row"><div class="arch-label">Repeatable Read</div><div class="arch-val">Non-repeatable reads nahi — same row baar baar same value milegi. Phantom reads possible. MySQL default.</div></div>
<div class="arch-row"><div class="arch-label">Serializable</div><div class="arch-val">Phantom reads bhi nahi — sabse safe, sabse slow. Full isolation.</div></div>
<div class="warn-box"><p><strong>Problems:</strong> Dirty Read = uncommitted data padha | Non-Repeatable Read = same row different values | Phantom Read = naye rows appear/disappear</p></div>
</div>
<div class="card"><div class="card-title">Transaction Commands</div>
<div class="cmd-block">
<div><span class="cmd">START TRANSACTION</span><span class="out">;</span>  <span class="out">-- transaction shuru karo</span></div>
<div><span class="cmd">UPDATE</span> accounts <span class="cmd">SET</span> balance = balance - <span class="fl">1000</span> <span class="cmd">WHERE</span> id = <span class="fl">1</span><span class="out">;</span></div>
<div><span class="cmd">UPDATE</span> accounts <span class="cmd">SET</span> balance = balance + <span class="fl">1000</span> <span class="cmd">WHERE</span> id = <span class="fl">2</span><span class="out">;</span></div>
<div><span class="cmd">COMMIT</span><span class="out">;</span>        <span class="out">-- permanent save karo</span></div>
<div><span class="out">-- ya</span></div>
<div><span class="cmd">ROLLBACK</span><span class="out">;</span>      <span class="out">-- undo karo sab kuch</span></div>
<div>&nbsp;</div>
<div><span class="cmd">SAVEPOINT</span> sp1<span class="out">;</span>  <span class="out">-- partial rollback ke liye</span></div>
<div><span class="cmd">ROLLBACK TO</span> sp1<span class="out">;</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>ACID properties kya hain? Har ek real example se explain karo.</li>
<li>Dirty read, Non-repeatable read, Phantom read — difference explain karo.</li>
<li>MySQL ka default isolation level kya hai? Kyun?</li>
<li>Isolation level badhane se performance pe kya effect padta hai?</li>
<li>Distributed transactions mein ACID kaise maintain karte hain?</li>
</ol></div>`},
  {num:`03`,title:`Normalization`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">Normalization kya hai?</div><ul class="note-list">
<li>Database design technique — <strong>redundancy remove karo</strong>, anomalies avoid karo</li>
<li><strong>Anomalies:</strong> Insertion anomaly | Update anomaly | Deletion anomaly</li>
<li>Normal Forms ek ke baad ek follow karte hain — 1NF → 2NF → 3NF → BCNF</li>
</ul></div>
<div class="card"><div class="card-title">Normal Forms</div>
<div class="arch-row"><div class="arch-label">1NF</div><div class="arch-val">Atomic values — har cell mein ek hi value. No repeating groups. No multi-valued attributes.</div></div>
<div class="arch-row"><div class="arch-label">2NF</div><div class="arch-val">1NF + No partial dependency — non-key attributes poore PK pe depend karein, uske part pe nahi.</div></div>
<div class="arch-row"><div class="arch-label">3NF</div><div class="arch-val">2NF + No transitive dependency — non-key attribute directly PK pe depend kare, kisi aur non-key se nahi.</div></div>
<div class="arch-row"><div class="arch-label">BCNF</div><div class="arch-val">Stronger 3NF — har determinant candidate key hona chahiye. 3NF ka edge case solve karta hai.</div></div>
<div class="arch-row"><div class="arch-label">4NF</div><div class="arch-val">BCNF + No multi-valued dependencies.</div></div>
</div>
<div class="card"><div class="card-title">Example — Normalization Step by Step</div>
<div class="cmd-block">
<div><span class="cmt">-- Unnormalized: Student(id, name, courses, phone_numbers)</span></div>
<div><span class="cmt">-- 1NF: phone_numbers ko alag karo</span></div>
<div><span class="cmd">CREATE TABLE</span> student_phones (student_id <span class="fl">INT</span>, phone <span class="fl">VARCHAR</span>(<span class="fl">15</span>))<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 2NF: (student_id, course_id) PK hai</span></div>
<div><span class="cmt">-- student_name sirf student_id pe depend karta hai — partial dependency!</span></div>
<div><span class="cmt">-- Fix: Students aur Enrollments alag tables</span></div>
<div><span class="cmd">CREATE TABLE</span> students (id <span class="fl">INT PRIMARY KEY</span>, name <span class="fl">VARCHAR</span>(<span class="fl">50</span>))<span class="out">;</span></div>
<div><span class="cmd">CREATE TABLE</span> enrollments (student_id <span class="fl">INT</span>, course_id <span class="fl">INT</span>)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 3NF: dept_name → dept_head transitive dependency</span></div>
<div><span class="cmt">-- Fix: Departments alag table</span></div>
<div><span class="cmd">CREATE TABLE</span> departments (dept_id <span class="fl">INT PRIMARY KEY</span>, name <span class="fl">VARCHAR</span>(<span class="fl">50</span>), head <span class="fl">VARCHAR</span>(<span class="fl">50</span>))<span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">Denormalization — Kab aur Kyun?</div><ul class="note-list">
<li>Performance ke liye intentionally redundancy add karo</li>
<li>Reads bahut zyada hain, joins expensive hain — denormalize karo</li>
<li><strong>Techniques:</strong> Duplicate columns, pre-computed aggregates, merged tables</li>
<li>Write complexity badhti hai, storage badhta hai — trade-off hai</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>1NF, 2NF, 3NF explain karo with examples.</li>
<li>Partial dependency aur Transitive dependency mein kya fark hai?</li>
<li>BCNF aur 3NF mein kya difference hai?</li>
<li>Kab denormalize karna chahiye? Trade-offs kya hain?</li>
<li>Functional dependency kya hoti hai?</li>
</ol></div>`},
  {num:`04`,title:`SQL Basics — DDL & DML`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">SQL Commands Categories</div>
<div class="arch-row"><div class="arch-label">DDL</div><div class="arch-val">Data Definition Language — CREATE, ALTER, DROP, TRUNCATE, RENAME. Schema define karo.</div></div>
<div class="arch-row"><div class="arch-label">DML</div><div class="arch-val">Data Manipulation Language — SELECT, INSERT, UPDATE, DELETE. Data manipulate karo.</div></div>
<div class="arch-row"><div class="arch-label">DCL</div><div class="arch-val">Data Control Language — GRANT, REVOKE. Permissions manage karo.</div></div>
<div class="arch-row"><div class="arch-label">TCL</div><div class="arch-val">Transaction Control — COMMIT, ROLLBACK, SAVEPOINT. Transactions manage karo.</div></div>
</div>
<div class="card"><div class="card-title">DDL Commands</div>
<div class="cmd-block">
<div><span class="cmt">-- Table create karo</span></div>
<div><span class="cmd">CREATE TABLE</span> employees (</div>
<div>  id         <span class="fl">INT AUTO_INCREMENT PRIMARY KEY</span>,</div>
<div>  name       <span class="fl">VARCHAR</span>(<span class="fl">100</span>) <span class="fl">NOT NULL</span>,</div>
<div>  email      <span class="fl">VARCHAR</span>(<span class="fl">150</span>) <span class="fl">UNIQUE</span>,</div>
<div>  salary     <span class="fl">DECIMAL</span>(<span class="fl">10,2</span>) <span class="fl">DEFAULT</span> <span class="fl">0.00</span>,</div>
<div>  dept_id    <span class="fl">INT</span>,</div>
<div>  created_at <span class="fl">TIMESTAMP DEFAULT CURRENT_TIMESTAMP</span>,</div>
<div>  <span class="fl">FOREIGN KEY</span> (dept_id) <span class="fl">REFERENCES</span> departments(id) <span class="fl">ON DELETE SET NULL</span></div>
<div>)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Table modify karo</span></div>
<div><span class="cmd">ALTER TABLE</span> employees <span class="cmd">ADD COLUMN</span> phone <span class="fl">VARCHAR</span>(<span class="fl">15</span>)<span class="out">;</span></div>
<div><span class="cmd">ALTER TABLE</span> employees <span class="cmd">MODIFY COLUMN</span> name <span class="fl">VARCHAR</span>(<span class="fl">200</span>)<span class="out">;</span></div>
<div><span class="cmd">ALTER TABLE</span> employees <span class="cmd">DROP COLUMN</span> phone<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- DELETE vs TRUNCATE vs DROP</span></div>
<div><span class="cmd">DELETE FROM</span> employees <span class="cmd">WHERE</span> id = <span class="fl">5</span><span class="out">;</span>  <span class="out">-- specific rows, rollback possible</span></div>
<div><span class="cmd">TRUNCATE TABLE</span> employees<span class="out">;</span>           <span class="out">-- sab rows, fast, no rollback</span></div>
<div><span class="cmd">DROP TABLE</span> employees<span class="out">;</span>               <span class="out">-- table hi delete kar do</span></div>
</div></div>
<div class="card"><div class="card-title">DML Commands</div>
<div class="cmd-block">
<div><span class="cmt">-- Insert</span></div>
<div><span class="cmd">INSERT INTO</span> employees (name, email, salary) <span class="cmd">VALUES</span></div>
<div>  (<span class="str">"Rahul"</span>, <span class="str">"rahul@email.com"</span>, <span class="fl">50000</span>),</div>
<div>  (<span class="str">"Priya"</span>, <span class="str">"priya@email.com"</span>, <span class="fl">60000</span>)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Update</span></div>
<div><span class="cmd">UPDATE</span> employees <span class="cmd">SET</span> salary = salary * <span class="fl">1.10</span></div>
<div><span class="cmd">WHERE</span> dept_id = <span class="fl">3</span> <span class="cmd">AND</span> salary &lt; <span class="fl">80000</span><span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Delete</span></div>
<div><span class="cmd">DELETE FROM</span> employees <span class="cmd">WHERE</span> created_at &lt; <span class="str">"2020-01-01"</span><span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Upsert (Insert or Update)</span></div>
<div><span class="cmd">INSERT INTO</span> employees (id, name, salary) <span class="cmd">VALUES</span> (<span class="fl">1</span>, <span class="str">"Rahul"</span>, <span class="fl">55000</span>)</div>
<div><span class="cmd">ON DUPLICATE KEY UPDATE</span> salary = <span class="fl">55000</span><span class="out">;</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>DELETE vs TRUNCATE vs DROP — detailed difference kya hai?</li>
<li>ON DELETE CASCADE vs ON DELETE SET NULL — kab kya use karoge?</li>
<li>AUTO_INCREMENT reset kaise karte hain MySQL mein?</li>
<li>CHAR vs VARCHAR vs TEXT — kab kya use karoge?</li>
<li>NULL values ke saath kaise deal karte hain SQL mein?</li>
</ol></div>`},
  {num:`05`,title:`SQL Queries — SELECT & Joins`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">SELECT Query Structure</div>
<div class="cmd-block">
<div><span class="cmt">-- SELECT execution order (writing order alag, execution order alag!)</span></div>
<div><span class="out">-- FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</span></div>
<div>&nbsp;</div>
<div><span class="cmd">SELECT</span> d.name <span class="cmd">AS</span> dept, <span class="cmd">COUNT</span>(e.id) <span class="cmd">AS</span> emp_count, <span class="cmd">AVG</span>(e.salary) <span class="cmd">AS</span> avg_sal</div>
<div><span class="cmd">FROM</span> employees e</div>
<div><span class="cmd">JOIN</span> departments d <span class="cmd">ON</span> e.dept_id = d.id</div>
<div><span class="cmd">WHERE</span> e.salary > <span class="fl">30000</span></div>
<div><span class="cmd">GROUP BY</span> d.name</div>
<div><span class="cmd">HAVING</span> <span class="cmd">COUNT</span>(e.id) > <span class="fl">5</span></div>
<div><span class="cmd">ORDER BY</span> avg_sal <span class="cmd">DESC</span></div>
<div><span class="cmd">LIMIT</span> <span class="fl">10</span> <span class="cmd">OFFSET</span> <span class="fl">0</span><span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">JOIN Types</div>
<div class="arch-row"><div class="arch-label">INNER JOIN</div><div class="arch-val">Sirf matching rows dono tables mein. Non-matching rows exclude.</div></div>
<div class="arch-row"><div class="arch-label">LEFT JOIN</div><div class="arch-val">Sab left table rows + matching right rows. Right mein nahi toh NULL.</div></div>
<div class="arch-row"><div class="arch-label">RIGHT JOIN</div><div class="arch-val">Sab right table rows + matching left rows. Left mein nahi toh NULL.</div></div>
<div class="arch-row"><div class="arch-label">FULL OUTER JOIN</div><div class="arch-val">Dono tables ke sab rows. MySQL mein nahi — LEFT UNION RIGHT se simulate karo.</div></div>
<div class="arch-row"><div class="arch-label">CROSS JOIN</div><div class="arch-val">Cartesian product — har row har dusri row se combine. M×N rows.</div></div>
<div class="arch-row"><div class="arch-label">SELF JOIN</div><div class="arch-val">Table apne aap se join — hierarchy, manager-employee relationships.</div></div>
<div class="cmd-block">
<div><span class="cmt">-- Self join example: Manager ka naam nikalo</span></div>
<div><span class="cmd">SELECT</span> e.name <span class="cmd">AS</span> employee, m.name <span class="cmd">AS</span> manager</div>
<div><span class="cmd">FROM</span> employees e</div>
<div><span class="cmd">LEFT JOIN</span> employees m <span class="cmd">ON</span> e.manager_id = m.id<span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">Aggregate Functions & GROUP BY</div>
<div class="cmd-block">
<div><span class="cmt">-- Aggregate functions</span></div>
<div><span class="cmd">SELECT</span></div>
<div>  <span class="cmd">COUNT</span>(*),           <span class="out">-- total rows</span></div>
<div>  <span class="cmd">COUNT</span>(DISTINCT dept_id),  <span class="out">-- unique depts</span></div>
<div>  <span class="cmd">SUM</span>(salary),        <span class="out">-- total salary</span></div>
<div>  <span class="cmd">AVG</span>(salary),        <span class="out">-- average</span></div>
<div>  <span class="cmd">MAX</span>(salary),        <span class="out">-- highest</span></div>
<div>  <span class="cmd">MIN</span>(salary)         <span class="out">-- lowest</span></div>
<div><span class="cmd">FROM</span> employees<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- WHERE vs HAVING</span></div>
<div><span class="cmt">-- WHERE: individual rows filter karo (GROUP BY se pehle)</span></div>
<div><span class="cmt">-- HAVING: groups filter karo (GROUP BY ke baad)</span></div>
<div><span class="cmd">SELECT</span> dept_id, <span class="cmd">AVG</span>(salary) avg_sal</div>
<div><span class="cmd">FROM</span> employees</div>
<div><span class="cmd">WHERE</span> active = <span class="fl">1</span>              <span class="out">-- row level filter</span></div>
<div><span class="cmd">GROUP BY</span> dept_id</div>
<div><span class="cmd">HAVING</span> <span class="cmd">AVG</span>(salary) > <span class="fl">50000</span><span class="out">;</span>  <span class="out">-- group level filter</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>SQL query execution order kya hoti hai? SELECT pehle kyun nahi hota?</li>
<li>INNER JOIN vs LEFT JOIN — kab kya use karoge? Example do.</li>
<li>WHERE vs HAVING — exact difference explain karo.</li>
<li>Second highest salary nikalne ke 3 tarike batao.</li>
<li>Duplicate rows find karke delete karne ki query likho.</li>
<li>Self join kab use karte hain? Manager-Employee hierarchy query likho.</li>
</ol></div>`},
  {num:`06`,title:`Subqueries & Advanced SQL`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Subqueries</div>
<div class="cmd-block">
<div><span class="cmt">-- Scalar subquery (single value return)</span></div>
<div><span class="cmd">SELECT</span> name, salary</div>
<div><span class="cmd">FROM</span> employees</div>
<div><span class="cmd">WHERE</span> salary > (<span class="cmd">SELECT AVG</span>(salary) <span class="cmd">FROM</span> employees)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- IN subquery</span></div>
<div><span class="cmd">SELECT</span> name <span class="cmd">FROM</span> employees</div>
<div><span class="cmd">WHERE</span> dept_id <span class="cmd">IN</span> (<span class="cmd">SELECT</span> id <span class="cmd">FROM</span> departments <span class="cmd">WHERE</span> location = <span class="str">"Mumbai"</span>)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Correlated subquery (outer query pe depend karta hai)</span></div>
<div><span class="cmd">SELECT</span> e1.name, e1.salary</div>
<div><span class="cmd">FROM</span> employees e1</div>
<div><span class="cmd">WHERE</span> salary > (<span class="cmd">SELECT AVG</span>(salary) <span class="cmd">FROM</span> employees e2</div>
<div>               <span class="cmd">WHERE</span> e2.dept_id = e1.dept_id)<span class="out">;</span></div>
<div><span class="cmt">-- Apne department ki average se zyada salary wale employees</span></div>
</div></div>
<div class="card"><div class="card-title">CTEs — Common Table Expressions</div>
<div class="cmd-block">
<div><span class="cmt">-- CTE — readable, reusable temporary result set</span></div>
<div><span class="cmd">WITH</span> dept_stats <span class="cmd">AS</span> (</div>
<div>  <span class="cmd">SELECT</span> dept_id, <span class="cmd">AVG</span>(salary) avg_sal, <span class="cmd">COUNT</span>(*) emp_count</div>
<div>  <span class="cmd">FROM</span> employees</div>
<div>  <span class="cmd">GROUP BY</span> dept_id</div>
<div>),</div>
<div>top_depts <span class="cmd">AS</span> (</div>
<div>  <span class="cmd">SELECT</span> * <span class="cmd">FROM</span> dept_stats <span class="cmd">WHERE</span> emp_count > <span class="fl">10</span></div>
<div>)</div>
<div><span class="cmd">SELECT</span> d.name, td.avg_sal</div>
<div><span class="cmd">FROM</span> top_depts td</div>
<div><span class="cmd">JOIN</span> departments d <span class="cmd">ON</span> td.dept_id = d.id<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Recursive CTE — hierarchy traverse karo</span></div>
<div><span class="cmd">WITH RECURSIVE</span> emp_hierarchy <span class="cmd">AS</span> (</div>
<div>  <span class="cmd">SELECT</span> id, name, manager_id, <span class="fl">0</span> <span class="cmd">AS</span> level</div>
<div>  <span class="cmd">FROM</span> employees <span class="cmd">WHERE</span> manager_id <span class="cmd">IS NULL</span>   <span class="out">-- root (CEO)</span></div>
<div>  <span class="cmd">UNION ALL</span></div>
<div>  <span class="cmd">SELECT</span> e.id, e.name, e.manager_id, h.level + <span class="fl">1</span></div>
<div>  <span class="cmd">FROM</span> employees e</div>
<div>  <span class="cmd">JOIN</span> emp_hierarchy h <span class="cmd">ON</span> e.manager_id = h.id</div>
<div>)</div>
<div><span class="cmd">SELECT</span> * <span class="cmd">FROM</span> emp_hierarchy<span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">Window Functions</div>
<div class="cmd-block">
<div><span class="cmt">-- ROW_NUMBER, RANK, DENSE_RANK</span></div>
<div><span class="cmd">SELECT</span> name, salary, dept_id,</div>
<div>  <span class="cmd">ROW_NUMBER</span>() <span class="cmd">OVER</span> (<span class="cmd">PARTITION BY</span> dept_id <span class="cmd">ORDER BY</span> salary <span class="cmd">DESC</span>) <span class="cmd">AS</span> row_num,</div>
<div>  <span class="cmd">RANK</span>()       <span class="cmd">OVER</span> (<span class="cmd">PARTITION BY</span> dept_id <span class="cmd">ORDER BY</span> salary <span class="cmd">DESC</span>) <span class="cmd">AS</span> rnk,</div>
<div>  <span class="cmd">DENSE_RANK</span>() <span class="cmd">OVER</span> (<span class="cmd">PARTITION BY</span> dept_id <span class="cmd">ORDER BY</span> salary <span class="cmd">DESC</span>) <span class="cmd">AS</span> dense_rnk,</div>
<div>  <span class="cmd">LAG</span>(salary)  <span class="cmd">OVER</span> (<span class="cmd">ORDER BY</span> salary)  <span class="cmd">AS</span> prev_salary,</div>
<div>  <span class="cmd">LEAD</span>(salary) <span class="cmd">OVER</span> (<span class="cmd">ORDER BY</span> salary)  <span class="cmd">AS</span> next_salary</div>
<div><span class="cmd">FROM</span> employees<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Nth highest salary (using DENSE_RANK)</span></div>
<div><span class="cmd">SELECT</span> salary <span class="cmd">FROM</span> (</div>
<div>  <span class="cmd">SELECT</span> salary, <span class="cmd">DENSE_RANK</span>() <span class="cmd">OVER</span> (<span class="cmd">ORDER BY</span> salary <span class="cmd">DESC</span>) dr</div>
<div>  <span class="cmd">FROM</span> employees</div>
<div>) t <span class="cmd">WHERE</span> dr = <span class="fl">2</span><span class="out">;</span>  <span class="out">-- 2nd highest</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Correlated subquery kya hai? Performance pe kya impact hota hai?</li>
<li>CTE vs Subquery vs Temp Table — kab kya prefer karoge?</li>
<li>RANK vs DENSE_RANK vs ROW_NUMBER — difference explain karo.</li>
<li>LAG aur LEAD window functions kab use karte hain?</li>
<li>Recursive CTE kya hai? Kab use karte hain?</li>
<li>Department mein top 3 salary wale employees nikalo — query likho.</li>
</ol></div>`},
  {num:`07`,title:`Indexes — Performance Tuning`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Indexes kya hote hain?</div><ul class="note-list">
<li>Data structure jo data quickly dhundne mein help karta hai — book ka index jaisa</li>
<li>Without index: O(n) full table scan | With index: O(log n) B-Tree search</li>
<li><strong>Trade-off:</strong> Reads fast, Writes slow (index bhi update hota hai), Storage zyada</li>
<li>MySQL mein InnoDB B+ Tree index use karta hai</li>
</ul></div>
<div class="card"><div class="card-title">Index Types</div>
<div class="arch-row"><div class="arch-label">Primary Index</div><div class="arch-val">Primary Key pe automatic — Clustered index. Data physically is order mein store hota hai.</div></div>
<div class="arch-row"><div class="arch-label">Unique Index</div><div class="arch-val">Duplicate values nahi ho sakte. UNIQUE constraint automatically create karta hai.</div></div>
<div class="arch-row"><div class="arch-label">Composite Index</div><div class="arch-val">Multiple columns pe ek index. Column order matters! (a,b,c) — a, ab, abc ke liye kaam karta hai.</div></div>
<div class="arch-row"><div class="arch-label">Covering Index</div><div class="arch-val">Query ke sab columns index mein hain — table lookup nahi hoga. Fastest reads.</div></div>
<div class="arch-row"><div class="arch-label">Full-Text Index</div><div class="arch-val">Text search ke liye — MATCH() AGAINST() use karo. LIKE % se better.</div></div>
<div class="arch-row"><div class="arch-label">Partial Index</div><div class="arch-val">Sirf kuch rows ka index — WHERE condition ke saath. Smaller, faster.</div></div>
</div>
<div class="card"><div class="card-title">Index Commands & EXPLAIN</div>
<div class="cmd-block">
<div><span class="cmt">-- Index create karo</span></div>
<div><span class="cmd">CREATE INDEX</span> idx_salary <span class="cmd">ON</span> employees(salary)<span class="out">;</span></div>
<div><span class="cmd">CREATE UNIQUE INDEX</span> idx_email <span class="cmd">ON</span> employees(email)<span class="out">;</span></div>
<div><span class="cmd">CREATE INDEX</span> idx_dept_salary <span class="cmd">ON</span> employees(dept_id, salary)<span class="out">;</span>  <span class="out">-- composite</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Index dekho</span></div>
<div><span class="cmd">SHOW INDEX FROM</span> employees<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- EXPLAIN -- query execution plan dekho</span></div>
<div><span class="cmd">EXPLAIN SELECT</span> * <span class="cmd">FROM</span> employees <span class="cmd">WHERE</span> salary > <span class="fl">50000</span><span class="out">;</span></div>
<div><span class="cmt">-- type: ALL=bad, index=ok, range=good, ref=good, const=best</span></div>
<div><span class="cmt">-- key: which index is being used</span></div>
<div><span class="cmt">-- rows: estimated rows to scan (kam = better)</span></div>
</div></div>
<div class="card"><div class="card-title">Index Best Practices</div><ul class="note-list">
<li><strong>Index karo:</strong> WHERE, JOIN, ORDER BY, GROUP BY columns</li>
<li><strong>Index mat karo:</strong> Low cardinality columns (gender — sirf 2 values)</li>
<li><strong>Leftmost prefix rule:</strong> Composite index (a,b,c) — sirf a, ab, abc work karta hai</li>
<li><strong>Index selectivity:</strong> Unique values / total rows — 1.0 = perfect</li>
<li><strong>Too many indexes:</strong> Write performance suffer karta hai</li>
</ul>
<div class="warn-box"><p><strong>Common mistake:</strong> Function use karna WHERE clause mein index bypass karta hai! <code>WHERE YEAR(created_at) = 2024</code> instead of <code>WHERE created_at BETWEEN "2024-01-01" AND "2024-12-31"</code></p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Clustered vs Non-clustered index — kya difference hai?</li>
<li>Composite index mein column order kyun matter karta hai?</li>
<li>Covering index kya hai? Kaise banate hain?</li>
<li>EXPLAIN output mein kya dekhte hain? type column ka matlab?</li>
<li>Index hone ke bawajood query slow kyun ho sakti hai?</li>
<li>Index kab nahi banana chahiye?</li>
</ol></div>`},
  {num:`08`,title:`MySQL Specific Features`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">MySQL Storage Engines</div>
<div class="arch-row"><div class="arch-label">InnoDB</div><div class="arch-val">Default engine — ACID compliant, Foreign keys, Row-level locking, MVCC. Production ke liye.</div></div>
<div class="arch-row"><div class="arch-label">MyISAM</div><div class="arch-val">Table-level locking, no FK support, faster reads, no transactions. Legacy only.</div></div>
<div class="arch-row"><div class="arch-label">Memory</div><div class="arch-val">RAM mein store — ultra fast, volatile. Temporary tables ke liye.</div></div>
<div class="arch-row"><div class="arch-label">Archive</div><div class="arch-val">Highly compressed, insert-only, no indexes. Log data store karne ke liye.</div></div>
</div>
<div class="card"><div class="card-title">Views</div>
<div class="cmd-block">
<div><span class="cmt">-- View create karo — virtual table</span></div>
<div><span class="cmd">CREATE VIEW</span> active_employees <span class="cmd">AS</span></div>
<div><span class="cmd">SELECT</span> id, name, email, salary</div>
<div><span class="cmd">FROM</span> employees</div>
<div><span class="cmd">WHERE</span> status = <span class="str">"active"</span><span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- View use karo table ki tarah</span></div>
<div><span class="cmd">SELECT</span> * <span class="cmd">FROM</span> active_employees <span class="cmd">WHERE</span> salary > <span class="fl">50000</span><span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Updatable view (simple views)</span></div>
<div><span class="cmd">UPDATE</span> active_employees <span class="cmd">SET</span> salary = <span class="fl">55000</span> <span class="cmd">WHERE</span> id = <span class="fl">1</span><span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">Stored Procedures & Functions</div>
<div class="cmd-block">
<div><span class="cmt">-- Stored Procedure</span></div>
<div><span class="cmd">DELIMITER</span> //</div>
<div><span class="cmd">CREATE PROCEDURE</span> get_dept_employees(IN dept_name <span class="fl">VARCHAR</span>(<span class="fl">50</span>))</div>
<div><span class="cmd">BEGIN</span></div>
<div>  <span class="cmd">SELECT</span> e.name, e.salary</div>
<div>  <span class="cmd">FROM</span> employees e</div>
<div>  <span class="cmd">JOIN</span> departments d <span class="cmd">ON</span> e.dept_id = d.id</div>
<div>  <span class="cmd">WHERE</span> d.name = dept_name<span class="out">;</span></div>
<div><span class="cmd">END</span> //</div>
<div><span class="cmd">DELIMITER</span> <span class="out">;</span></div>
<div><span class="cmd">CALL</span> get_dept_employees(<span class="str">"Engineering"</span>)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Trigger</span></div>
<div><span class="cmd">CREATE TRIGGER</span> before_salary_update</div>
<div><span class="cmd">BEFORE UPDATE ON</span> employees</div>
<div><span class="cmd">FOR EACH ROW</span></div>
<div><span class="cmd">BEGIN</span></div>
<div>  <span class="cmd">IF</span> NEW.salary &lt; <span class="fl">0</span> <span class="cmd">THEN</span></div>
<div>    <span class="cmd">SIGNAL SQLSTATE</span> <span class="str">"45000"</span> <span class="cmd">SET MESSAGE_TEXT</span> = <span class="str">"Salary negative nahi ho sakta"</span><span class="out">;</span></div>
<div>  <span class="cmd">END IF</span><span class="out">;</span></div>
<div><span class="cmd">END</span><span class="out">;</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>InnoDB vs MyISAM — kab kya choose karoge?</li>
<li>View aur Table mein kya difference hai? Updatable view kab hoti hai?</li>
<li>Stored Procedure vs Function — kya difference hai?</li>
<li>Triggers kab use karte hain? Kya side effects hote hain?</li>
<li>MVCC (Multi-Version Concurrency Control) kya hai? InnoDB mein kaise kaam karta hai?</li>
</ol></div>`},
  {num:`09`,title:`Query Optimization`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Query Optimization Techniques</div><ul class="note-list">
<li><strong>EXPLAIN ANALYZE:</strong> Actual execution stats — estimated vs actual rows</li>
<li><strong>Avoid SELECT *:</strong> Sirf zaroori columns select karo</li>
<li><strong>Index hints:</strong> <code>FORCE INDEX (idx_name)</code> — optimizer ko guide karo</li>
<li><strong>Query cache:</strong> MySQL 8 mein removed — application-level cache use karo</li>
<li><strong>Pagination:</strong> LIMIT/OFFSET large tables pe slow — keyset pagination better</li>
</ul></div>
<div class="card"><div class="card-title">Common Performance Anti-Patterns</div>
<div class="cmd-block">
<div><span class="cmt">-- BAD: Function in WHERE — index bypass!</span></div>
<div><span class="cmd">WHERE</span> <span class="cmd">YEAR</span>(created_at) = <span class="fl">2024</span></div>
<div><span class="cmt">-- GOOD: Range condition use karo</span></div>
<div><span class="cmd">WHERE</span> created_at <span class="cmd">BETWEEN</span> <span class="str">"2024-01-01"</span> <span class="cmd">AND</span> <span class="str">"2024-12-31"</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- BAD: OR can prevent index use</span></div>
<div><span class="cmd">WHERE</span> dept_id = <span class="fl">1</span> <span class="cmd">OR</span> dept_id = <span class="fl">2</span></div>
<div><span class="cmt">-- GOOD: IN is better</span></div>
<div><span class="cmd">WHERE</span> dept_id <span class="cmd">IN</span> (<span class="fl">1</span>, <span class="fl">2</span>)</div>
<div>&nbsp;</div>
<div><span class="cmt">-- BAD: N+1 problem</span></div>
<div><span class="cmt">-- Loop mein ek ek employee ki query — 1 + N queries!</span></div>
<div><span class="cmt">-- GOOD: Ek JOIN query mein sab lo</span></div>
<div><span class="cmd">SELECT</span> e.*, d.name <span class="cmd">FROM</span> employees e <span class="cmd">JOIN</span> departments d <span class="cmd">ON</span> e.dept_id = d.id<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- BAD: OFFSET pagination large tables pe</span></div>
<div><span class="cmd">SELECT</span> * <span class="cmd">FROM</span> employees <span class="cmd">ORDER BY</span> id <span class="cmd">LIMIT</span> <span class="fl">10</span> <span class="cmd">OFFSET</span> <span class="fl">100000</span><span class="out">;</span></div>
<div><span class="cmt">-- GOOD: Keyset pagination</span></div>
<div><span class="cmd">SELECT</span> * <span class="cmd">FROM</span> employees <span class="cmd">WHERE</span> id > <span class="fl">100000</span> <span class="cmd">ORDER BY</span> id <span class="cmd">LIMIT</span> <span class="fl">10</span><span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">MySQL Configuration Tuning</div><ul class="note-list">
<li><strong>innodb_buffer_pool_size:</strong> RAM ka 70-80% — most important setting</li>
<li><strong>max_connections:</strong> Concurrent connections limit — connection pool size ke hisaab se</li>
<li><strong>slow_query_log:</strong> Enable karo — slow queries log karo aur optimize karo</li>
<li><strong>query_cache:</strong> MySQL 8 mein deprecated — Redis use karo</li>
<li><strong>innodb_flush_log_at_trx_commit:</strong> 1=safe, 2=faster (slight data loss risk)</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>EXPLAIN output interpret karo — kya dekhte hain?</li>
<li>Slow query kaise debug karte hain? Step-by-step approach?</li>
<li>Keyset pagination vs OFFSET pagination — kab kya?</li>
<li>N+1 query problem kya hai? ORM mein kaise detect aur fix karte hain?</li>
<li>innodb_buffer_pool_size tune kaise karte hain?</li>
</ol></div>`},
  {num:`10`,title:`Replication & Scaling`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">MySQL Replication</div><ul class="note-list">
<li><strong>Master-Slave (Primary-Replica):</strong> Master writes, replicas reads serve karte hain</li>
<li><strong>Binary Log (binlog):</strong> Master sab changes log karta hai — replica apply karta hai</li>
<li><strong>Async Replication:</strong> Default — fast but replica slightly behind ho sakta hai</li>
<li><strong>Semi-sync:</strong> At least ek replica confirm kare — data loss risk kam</li>
<li><strong>GTID:</strong> Global Transaction IDs — failover easy, replication reliable</li>
</ul></div>
<div class="card"><div class="card-title">Replication Setup Basics</div>
<div class="cmd-block">
<div><span class="cmt">-- Master pe binary log enable karo (my.cnf)</span></div>
<div>log_bin = mysql-bin</div>
<div>server_id = <span class="fl">1</span></div>
<div>binlog_format = ROW</div>
<div>&nbsp;</div>
<div><span class="cmt">-- Replica pe</span></div>
<div>server_id = <span class="fl">2</span></div>
<div>relay_log = relay-bin</div>
<div>&nbsp;</div>
<div><span class="cmt">-- Replica configure karo</span></div>
<div><span class="cmd">CHANGE MASTER TO</span></div>
<div>  MASTER_HOST=<span class="str">"master-ip"</span>,</div>
<div>  MASTER_USER=<span class="str">"repl_user"</span>,</div>
<div>  MASTER_PASSWORD=<span class="str">"password"</span>,</div>
<div>  MASTER_AUTO_POSITION=<span class="fl">1</span><span class="out">;</span>  <span class="out">-- GTID based</span></div>
<div><span class="cmd">START SLAVE</span><span class="out">;</span></div>
<div><span class="cmd">SHOW SLAVE STATUS</span>\\G  <span class="out">-- Seconds_Behind_Master check karo</span></div>
</div></div>
<div class="card"><div class="card-title">Partitioning & Sharding</div>
<div class="arch-row"><div class="arch-label">RANGE Partition</div><div class="arch-val">Date range ya value range — logs, time-series data ke liye. Old partitions easy delete.</div></div>
<div class="arch-row"><div class="arch-label">HASH Partition</div><div class="arch-val">Hash function se evenly distribute karo. Load balance ke liye.</div></div>
<div class="arch-row"><div class="arch-label">LIST Partition</div><div class="arch-val">Specific values ke liye — region = "North", "South", "East".</div></div>
<div class="arch-row"><div class="arch-label">Horizontal Sharding</div><div class="arch-val">Data alag servers pe — User A-M on DB1, N-Z on DB2. Application level handle karna padta hai.</div></div>
<div class="cmd-block">
<div><span class="cmt">-- Range partitioning example</span></div>
<div><span class="cmd">CREATE TABLE</span> orders (</div>
<div>  id <span class="fl">INT</span>, order_date <span class="fl">DATE</span>, amount <span class="fl">DECIMAL</span>(<span class="fl">10,2</span>)</div>
<div>) <span class="cmd">PARTITION BY RANGE</span> (<span class="cmd">YEAR</span>(order_date)) (</div>
<div>  <span class="cmd">PARTITION</span> p2022 <span class="cmd">VALUES LESS THAN</span> (<span class="fl">2023</span>),</div>
<div>  <span class="cmd">PARTITION</span> p2023 <span class="cmd">VALUES LESS THAN</span> (<span class="fl">2024</span>),</div>
<div>  <span class="cmd">PARTITION</span> p2024 <span class="cmd">VALUES LESS THAN</span> (<span class="fl">2025</span>)</div>
<div>)<span class="out">;</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>MySQL replication kaise kaam karta hai? Lag kaise handle karoge?</li>
<li>Master fail ho gaye — failover process kya hoga?</li>
<li>Table partitioning vs Sharding — kya difference hai?</li>
<li>Replication lag monitoring kaise karoge?</li>
<li>Read replicas aur write master ke beech consistency kaise ensure karoge?</li>
</ol></div>`},
  {num:`11`,title:`Deadlocks & Locking`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Locks in MySQL</div>
<div class="arch-row"><div class="arch-label">Shared Lock (S)</div><div class="arch-val">Read lock — multiple transactions ek saath read kar sakte hain. <code>SELECT ... LOCK IN SHARE MODE</code></div></div>
<div class="arch-row"><div class="arch-label">Exclusive Lock (X)</div><div class="arch-val">Write lock — sirf ek transaction write kar sakta hai. <code>SELECT ... FOR UPDATE</code></div></div>
<div class="arch-row"><div class="arch-label">Row-level Lock</div><div class="arch-val">InnoDB — sirf specific rows lock hoti hain. High concurrency.</div></div>
<div class="arch-row"><div class="arch-label">Table-level Lock</div><div class="arch-val">MyISAM — poori table lock. Low concurrency.</div></div>
<div class="arch-row"><div class="arch-label">Gap Lock</div><div class="arch-val">Index gap lock — phantom reads rokne ke liye. Repeatable Read mein.</div></div>
</div>
<div class="card"><div class="card-title">Deadlocks</div><ul class="note-list">
<li>Do transactions ek dusre ka wait kar rahein — circular dependency</li>
<li>T1 locks row A, T2 locks row B, T1 wants B, T2 wants A — deadlock!</li>
<li>MySQL automatically detect karta hai aur victim transaction rollback karta hai</li>
</ul>
<div class="cmd-block">
<div><span class="cmt">-- Deadlock detect karo</span></div>
<div><span class="cmd">SHOW ENGINE INNODB STATUS</span>\\G</div>
<div><span class="cmt">-- LATEST DETECTED DEADLOCK section dekho</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- Current locks dekho</span></div>
<div><span class="cmd">SELECT</span> * <span class="cmd">FROM</span> information_schema.innodb_locks<span class="out">;</span></div>
<div><span class="cmd">SELECT</span> * <span class="cmd">FROM</span> information_schema.innodb_lock_waits<span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">Deadlock Prevention</div><ul class="note-list">
<li><strong>Same order:</strong> Hamesha same order mein tables/rows access karo</li>
<li><strong>Short transactions:</strong> Transactions chhote rakho — kam time locks hold karein</li>
<li><strong>Low isolation:</strong> Agar possible ho toh lower isolation level use karo</li>
<li><strong>Index properly:</strong> Full table scans zyada rows lock karte hain</li>
<li><strong>Retry logic:</strong> Application mein deadlock retry implement karo</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Deadlock kya hota hai? Example se explain karo.</li>
<li>MySQL deadlock ko kaise detect aur resolve karta hai?</li>
<li>Deadlocks prevent karne ke strategies kya hain?</li>
<li>SELECT FOR UPDATE kab use karte hain? Risk kya hai?</li>
<li>Optimistic locking vs Pessimistic locking — kab kya?</li>
</ol></div>`},
  {num:`12`,title:`MySQL Interview Prep`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Most Common Interview Queries</div>
<div class="cmd-block">
<div><span class="cmt">-- 1. Second highest salary</span></div>
<div><span class="cmd">SELECT MAX</span>(salary) <span class="cmd">FROM</span> employees <span class="cmd">WHERE</span> salary &lt; (<span class="cmd">SELECT MAX</span>(salary) <span class="cmd">FROM</span> employees)<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 2. Duplicate emails find karo</span></div>
<div><span class="cmd">SELECT</span> email, <span class="cmd">COUNT</span>(*) cnt <span class="cmd">FROM</span> employees <span class="cmd">GROUP BY</span> email <span class="cmd">HAVING</span> cnt > <span class="fl">1</span><span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 3. Employees without department</span></div>
<div><span class="cmd">SELECT</span> e.* <span class="cmd">FROM</span> employees e <span class="cmd">LEFT JOIN</span> departments d <span class="cmd">ON</span> e.dept_id = d.id <span class="cmd">WHERE</span> d.id <span class="cmd">IS NULL</span><span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 4. Department wise highest salary</span></div>
<div><span class="cmd">SELECT</span> dept_id, <span class="cmd">MAX</span>(salary) max_sal <span class="cmd">FROM</span> employees <span class="cmd">GROUP BY</span> dept_id<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 5. Employees with salary above dept average</span></div>
<div><span class="cmd">SELECT</span> e.name, e.salary, e.dept_id <span class="cmd">FROM</span> employees e</div>
<div><span class="cmd">JOIN</span> (<span class="cmd">SELECT</span> dept_id, <span class="cmd">AVG</span>(salary) avg_sal <span class="cmd">FROM</span> employees <span class="cmd">GROUP BY</span> dept_id) d</div>
<div><span class="cmd">ON</span> e.dept_id = d.dept_id <span class="cmd">WHERE</span> e.salary > d.avg_sal<span class="out">;</span></div>
<div>&nbsp;</div>
<div><span class="cmt">-- 6. Consecutive duplicate rows find karo (using LAG)</span></div>
<div><span class="cmd">SELECT DISTINCT</span> num <span class="cmd">FROM</span> (</div>
<div>  <span class="cmd">SELECT</span> num,</div>
<div>    <span class="cmd">LAG</span>(num) <span class="cmd">OVER</span> (<span class="cmd">ORDER BY</span> id) prev,</div>
<div>    <span class="cmd">LEAD</span>(num) <span class="cmd">OVER</span> (<span class="cmd">ORDER BY</span> id) nxt</div>
<div>  <span class="cmd">FROM</span> logs</div>
<div>) t <span class="cmd">WHERE</span> num = prev <span class="cmd">AND</span> num = nxt<span class="out">;</span></div>
</div></div>
<div class="card"><div class="card-title">Quick Revision — Important Concepts</div>
<div class="arch-row"><div class="arch-label">UNION vs UNION ALL</div><div class="arch-val">UNION = duplicates remove karo (slow) | UNION ALL = sab rakho (fast). Use UNION ALL jab duplicates nahi honge.</div></div>
<div class="arch-row"><div class="arch-label">COALESCE vs IFNULL</div><div class="arch-val">COALESCE(a,b,c) = pehla non-null value. IFNULL(a,b) = sirf 2 arguments. COALESCE prefer karo.</div></div>
<div class="arch-row"><div class="arch-label">EXISTS vs IN</div><div class="arch-val">EXISTS = subquery row milte hi stop (fast for large). IN = sab check karo. Large subqueries mein EXISTS better.</div></div>
<div class="arch-row"><div class="arch-label">CHAR vs VARCHAR</div><div class="arch-val">CHAR = fixed length (padded), fast. VARCHAR = variable length, space efficient. Fixed size ke liye CHAR.</div></div>
<div class="arch-row"><div class="arch-label">MyISAM vs InnoDB</div><div class="arch-val">InnoDB = transactions, FK, row-lock. MyISAM = no transactions, table-lock, legacy.</div></div>
</div>
<div class="card"><div class="card-title">Resources</div>
<div class="chips">
<span class="chip">📘 MySQL Official Docs</span>
<span class="chip">🎮 LeetCode SQL Problems</span>
<span class="chip">📖 SQL Zoo</span>
<span class="chip">🎥 Techno TRG YouTube</span>
<span class="chip">📗 HackerRank SQL</span>
<span class="chip">📝 Mode Analytics SQL Tutorial</span>
</div></div>
<div class="q-section"><div class="q-title">Final Interview Questions</div><ol class="q-list">
<li>UNION vs JOIN — kab kya use karoge?</li>
<li>Correlated subquery vs EXISTS — performance comparison karo.</li>
<li>Database design karo ek e-commerce app ke liye — tables aur relationships.</li>
<li>Million rows table ko efficiently query karne ki strategy kya hogi?</li>
<li>MySQL database ko production mein secure kaise karte hain?</li>
<li>Online schema migration bina downtime ke kaise karte hain?</li>
</ol></div>`}
];
