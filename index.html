<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — A to Z</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0eeff;--muted:#8880aa;--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HOME SCREEN ── */
#homeScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;}
.home-title{font-family:'Syne',sans-serif;font-size:32px;font-weight:700;text-align:center;margin-bottom:8px;}
.home-sub{font-size:15px;color:var(--muted);text-align:center;margin-bottom:48px;}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:780px;width:100%;}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.course-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.2s;}
.course-card:hover{transform:translateY(-4px);border-color:var(--border2);}
.course-card:hover::before{opacity:1;}
.course-card.sd::before{background:radial-gradient(circle at 50% 0%,rgba(124,106,247,0.12),transparent 70%);}
.course-card.git::before{background:radial-gradient(circle at 50% 0%,rgba(62,207,142,0.12),transparent 70%);}
.course-card.dsa::before{background:radial-gradient(circle at 50% 0%,rgba(247,185,85,0.12),transparent 70%);}
.c-icon{font-size:36px;margin-bottom:14px;display:block;}
.c-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;}
.c-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px;}
.c-count{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-block;}
.sd .c-count{background:rgba(124,106,247,0.15);color:#a998ff;}
.git .c-count{background:rgba(62,207,142,0.15);color:#3ecf8e;}
.dsa .c-count{background:rgba(247,185,85,0.15);color:#f7b955;}
.c-arrow{position:absolute;top:28px;right:24px;font-size:18px;color:var(--border2);transition:all 0.2s;}
.course-card:hover .c-arrow{color:var(--text);transform:translateX(3px);}

/* ── NOTES SCREEN ── */
#notesScreen{display:none;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:256px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;padding:0;z-index:100;}
.sidebar::-webkit-scrollbar{width:4px;}.sidebar::-webkit-scrollbar-thumb{background:var(--surface2);}
.sidebar-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.back-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.back-btn:hover{color:var(--text);border-color:var(--text);}
.sidebar-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);padding:14px 20px 5px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 20px;cursor:pointer;font-size:13px;color:var(--muted);border-left:2px solid transparent;transition:all 0.15s;text-decoration:none;}
.nav-item:hover{color:var(--text);background:var(--surface2);}
.nav-item.active{color:var(--text);border-left-color:var(--accent-color);background:var(--accent-bg);}
.nav-num{width:22px;height:22px;background:var(--surface2);border-radius:50%;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-item.active .nav-num{background:var(--accent-color);color:#0a0a0f;}
.nav-badge{margin-left:auto;font-size:9px;padding:2px 6px;border-radius:20px;font-weight:600;}
.badge-fund{background:rgba(62,207,142,0.15);color:#3ecf8e;}
.badge-inter{background:rgba(247,185,85,0.15);color:#f7b955;}
.badge-adv{background:rgba(247,124,106,0.15);color:#f77c6a;}

/* Tab bar */
.tab-bar-wrap{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tab-bar-wrap::-webkit-scrollbar{display:none;}
.tab-bar{display:flex;min-width:max-content;padding:8px 48px;gap:2px;}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;transition:all 0.15s;white-space:nowrap;min-width:66px;}
.tab-btn:hover{background:var(--surface2);color:var(--text);}
.tab-btn.active{background:var(--accent-tab-bg);color:var(--accent-color);border-bottom:2px solid var(--accent-color);border-radius:var(--radius-sm) var(--radius-sm) 0 0;}
.tab-btn .t-num{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;line-height:1;}
.tab-btn .t-label{font-size:10px;opacity:0.8;}

/* Main */
.main{margin-left:256px;padding:0 48px 40px;max-width:960px;}
.section{display:none;animation:fi 0.2s ease;}
.section.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.section-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px;padding:28px 0 24px;border-bottom:1px solid var(--border);}
.section-num{font-family:'Syne',sans-serif;font-size:38px;font-weight:700;line-height:1;margin-top:4px;min-width:66px;color:var(--accent-dim);}
.section-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--text);line-height:1.2;}
.section-level{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-top:8px;display:inline-block;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:14px;transition:border-color 0.15s;}
.card:hover{border-color:var(--border2);}
.card-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--accent-color);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card-title::before{content:'';width:4px;height:15px;background:var(--accent-color);border-radius:2px;flex-shrink:0;opacity:0.7;}
.note-list{list-style:none;}
.note-list li{font-size:14px;color:#c4bfe8;padding:5px 0 5px 18px;position:relative;line-height:1.65;border-bottom:1px solid rgba(255,255,255,0.03);}
.note-list li:last-child{border-bottom:none;}
.note-list li::before{content:'▸';position:absolute;left:0;color:var(--accent-color);font-size:11px;top:7px;opacity:0.8;}
.note-list li strong{color:var(--text);font-weight:500;}
.note-list li code{background:rgba(124,106,247,0.15);color:#a998ff;font-size:12px;padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace;}
.cmd-block{background:#05050d;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:13px 16px;margin:10px 0;font-family:'DM Mono',monospace;font-size:13px;color:#c4bfe8;overflow-x:auto;}
.cmd-block div{line-height:1.9;}
.cmd-block .cmt{color:#3d3860;}.cmd-block .cmd{color:#3ecf8e;}.cmd-block .fl{color:#7dd3fc;}.cmd-block .str{color:#f7b955;}.cmd-block .out{color:#4d4870;font-size:12px;}
.arch-row{display:flex;margin-bottom:6px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
.arch-row:last-child{margin-bottom:0;}
.arch-label{background:var(--accent-row-bg);color:var(--accent-color);font-size:12px;font-weight:600;padding:8px 13px;min-width:115px;display:flex;align-items:center;font-family:'Syne',sans-serif;}
.arch-val{font-size:13px;color:#c4bfe8;padding:8px 13px;flex:1;line-height:1.5;background:var(--surface2);}
.arch-val code{background:rgba(124,106,247,0.15);color:#a998ff;font-size:12px;padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.col-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;}
.col-box-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;font-family:'Syne',sans-serif;}
.tip-box{background:rgba(62,207,142,0.07);border:1px solid rgba(62,207,142,0.25);border-radius:var(--radius-sm);padding:11px 15px;margin-top:12px;}
.tip-box p{font-size:13px;color:#9ee6c8;line-height:1.55;}.tip-box p strong{color:#3ecf8e;}
.warn-box{background:rgba(247,124,106,0.07);border:1px solid rgba(247,124,106,0.3);border-radius:var(--radius-sm);padding:11px 15px;margin-top:12px;}
.warn-box p{font-size:13px;color:#ffb3a0;line-height:1.55;}.warn-box p strong{color:#f77c6a;}
.info-box{background:rgba(124,106,247,0.07);border:1px solid rgba(124,106,247,0.25);border-radius:var(--radius-sm);padding:11px 15px;margin-top:12px;}
.info-box p{font-size:13px;color:#c4b8ff;line-height:1.55;}.info-box p strong{color:#a998ff;}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0;}
.flow-box{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-family:'DM Mono',monospace;color:#a998ff;}
.flow-arrow{color:var(--muted);font-size:16px;}
.flow-box.green{border-color:rgba(62,207,142,0.4);color:#3ecf8e;background:rgba(62,207,142,0.08);}
.flow-box.red{border-color:rgba(247,124,106,0.4);color:#f77c6a;background:rgba(247,124,106,0.08);}
.flow-box.blue{border-color:rgba(124,106,247,0.4);color:#a998ff;background:rgba(124,106,247,0.08);}
.q-section{background:var(--surface);border:1px solid var(--accent-border);border-radius:var(--radius);padding:18px 22px;margin-top:18px;}
.q-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent-color);margin-bottom:12px;letter-spacing:0.05em;text-transform:uppercase;}
.q-list{list-style:none;counter-reset:qc;}
.q-list li{font-size:14px;color:#c4bfe8;padding:8px 0 8px 34px;position:relative;border-bottom:1px solid var(--border);line-height:1.55;counter-increment:qc;}
.q-list li:last-child{border-bottom:none;}
.q-list li::before{content:counter(qc);position:absolute;left:0;top:9px;width:22px;height:22px;background:var(--accent-row-bg);color:var(--accent-color);font-size:11px;font-weight:600;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:22px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--border2);color:var(--muted);background:var(--surface2);}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:22px;border-top:1px solid var(--border);}
.nav-btn-b{display:flex;align-items:center;gap:8px;padding:9px 18px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.nav-btn-b:hover{background:var(--surface2);border-color:var(--accent-color);color:var(--accent-color);}
.nav-btn-b:disabled{opacity:0.3;cursor:not-allowed;}
.progress-wrap{flex:1;margin:0 18px;}
.progress-label{font-size:12px;color:var(--muted);text-align:center;margin-bottom:5px;}
.progress-track{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent-color);border-radius:2px;transition:width 0.3s ease;}
.mobile-top{display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px;position:sticky;top:0;z-index:200;align-items:center;gap:10px;}
.hamburger{background:none;border:1px solid var(--border2);border-radius:6px;padding:6px 10px;color:var(--text);cursor:pointer;font-size:16px;}
.mobile-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);flex:1;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:99;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform 0.25s;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .mobile-top{display:flex;}
  .main{margin-left:0;padding:0 14px 40px;}
  .section-title{font-size:20px;}
  .two-col{grid-template-columns:1fr;}
  .tab-bar{padding:8px 12px;}
  .tab-btn{min-width:56px;padding:6px 8px;}
  .course-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ── HOME SCREEN ── -->
<div id="homeScreen">
  <h1 class="home-title">📚 Atharva Notes — A to Z</h1>
  <p class="home-sub">Ek course choose karo — uske complete notes aur interview questions padho</p>
  <div class="course-grid" id="courseGrid"></div>
</div>

<!-- ── NOTES SCREEN ── -->
<div id="notesScreen">
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
  <div class="mobile-top">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <span class="mobile-title" id="mobileTitle"></span>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button class="back-btn" onclick="goHome()">← Courses</button>
        <span class="sidebar-title" id="sidebarTitle"></span>
      </div>
      <div id="navList"></div>
    </nav>
    <main class="main">
      <div class="tab-bar-wrap"><div class="tab-bar" id="tabBar"></div></div>
      <div style="height:4px"></div>
      <div id="sections"></div>
      <div class="bottom-nav">
        <button class="nav-btn-b" id="prevBtn" onclick="navigate(-1)">← Prev</button>
        <div class="progress-wrap">
          <div class="progress-label" id="progressLabel"></div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <button class="nav-btn-b" id="nextBtn" onclick="navigate(1)">Next →</button>
      </div>
    </main>
  </div>
</div>

<script>
const COURSES = [
  {
    "id": "sd",
    "icon": "\u26a1",
    "title": "System Design",
    "desc": "Architecture, scalability, databases, caching, microservices aur real-world systems",
    "count": 15,
    "accent": "#7c6af7",
    "accentBg": "rgba(124,106,247,0.1)",
    "accentTabBg": "rgba(124,106,247,0.15)",
    "accentBorder": "rgba(124,106,247,0.3)",
    "accentRowBg": "rgba(124,106,247,0.1)",
    "accentDim": "rgba(124,106,247,0.25)",
    "tabLabels": [
      "Fundamentals",
      "Scaling",
      "Databases",
      "Caching",
      "CDN & Net",
      "Msg Queue",
      "Microservices",
      "Consistent",
      "Rate Limit",
      "Storage",
      "Search",
      "Distributed",
      "Patterns",
      "Real Design",
      "Interview"
    ]
  },
  {
    "id": "git",
    "icon": "\ud83d\udc19",
    "title": "Git & GitHub",
    "desc": "Version control, branching, merging, GitHub Actions, PRs aur advanced Git",
    "count": 10,
    "accent": "#3ecf8e",
    "accentBg": "rgba(62,207,142,0.1)",
    "accentTabBg": "rgba(62,207,142,0.15)",
    "accentBorder": "rgba(62,207,142,0.3)",
    "accentRowBg": "rgba(62,207,142,0.1)",
    "accentDim": "rgba(62,207,142,0.25)",
    "tabLabels": [
      "Git Basics",
      "Basic Cmds",
      "Branching",
      "Merge/Rebase",
      "Remote",
      "Stash",
      "Reset",
      "Actions",
      "Pull Req",
      "Adv Git"
    ]
  }
];

const TOPICS = {
  sd: [
  {num:`01`,title:`Fundamentals & Basics`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">System Design kya hota hai?</div><ul class="note-list">
<li><strong>Definition:</strong> System Design is the process of designing the architecture, components, databases, APIs, and infrastructure of a software system so that it can handle real-world scale efficiently. — Instagram, WhatsApp, Uber jaise</li>
    <li><strong>Goal:</strong> Scalable, Reliable, Available, aur Maintainable system banana</li>
    <li><strong>Interview mein kyun:</strong> Real-world problem-solving + architectural thinking test hoti hai</li>
    <li><strong>HLD:</strong> High-Level Design is the process of defining the overall architecture and major components of a software system.— overall architecture, components, data flow</li>
    <li><strong>LLD:</strong> Low-Level Design  is the process of designing the internal code structure, classes, objects, and logic of a system.— class diagrams, DB schema, code structure</li>
</ul></div>
<div class="card"><div class="card-title">Key Properties (CARS)</div>
<div class="arch-row"><div class="arch-label">Consistency</div><div class="arch-val"><strong>means all nodes/servers in a distributed system have the same and latest data at the same time.</strong> Har server/node pe same data ho — bank balance same dikhna chahiye sab jagah.</div></div>
<div class="arch-row"><div class="arch-label">Availability</div><div class="arch-val"><strong>The system should always respond to user requests, even during high traffic or some failures.</strong> Example: When you open a website or app, it should give a response instead of showing "Server Down." System hamesha respond kare — 99.99% uptime target.</div></div>
<div class="arch-row"><div class="arch-label">Reliability</div><div class="arch-val"><strong>The system should continue to work correctly and not lose data, even if some components fail.</strong> Example: If one server crashes, your files or bank transactions should still be safe and accessible. Failures pe bhi kaam kare, data lose na ho.</div></div>
<div class="arch-row"><div class="arch-label">Scalability</div><div class="arch-val"><strong>The system should be able to handle increased traffic or workload without significant performance issues.</strong> Example: If users increase from 10,000 to 100,000, the system should still work smoothly by adding more resources or servers. Load badhne pe handle kar sake — 10x traffic suddenly aaye toh bhi.</div></div>
<div class="tip-box"><p><strong>CAP Theorem — Partition Tolerance:</strong> Partition Tolerance means the system can continue operating even when communication between servers is interrupted or fails. Example: Suppose there are two servers, one in Delhi and one in Mumbai. If the network connection between them breaks, they cannot communicate. A partition-tolerant system can still continue working despite this failure. <strong>Simple Definition:</strong> Ability of a distributed system to keep functioning even when some servers cannot communicate due to network issues. Consistency, Availability, Partition Tolerance — teeno ek saath impossible. Sirf 2 choose kar sakte ho. Network partition real world mein inevitable hai.</p></div>
</div>
<div class="card"><div class="card-title">Back-of-Envelope Numbers</div><ul class="note-list">
<li><strong>1 Billion users</strong> = ~1000 req/sec avg, ~10,000 peak</li>
<li><strong>Storage:</strong> 1KB=10³, 1MB=10⁶, 1GB=10⁹, 1TB=10¹² bytes</li>
<li><strong>SSD:</strong> ~0.1ms | <strong>RAM:</strong> ~0.0001ms | <strong>Network global:</strong> ~150ms</li>
<li><strong>99.9% uptime</strong> = 8.76 hrs downtime/year | <strong>99.99%</strong> = 52 min/year</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>CAP theorem kya hota hai? Real-world example ke saath explain karo.</li>
<li>Scalability aur Performance mein kya fark hai?</li>
<li>99.99% availability — yearly downtime calculate karo.</li>
<li>Latency vs Throughput — dono optimize karna kyun mushkil hai?</li>
<li>System Design interview mein pehla step kya hona chahiye?</li>
<li>PACELC theorem kya hai? CAP se kaise alag hai?</li>
</ol></div>`},
  {num:`02`,title:`Scaling Strategies`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">Vertical vs Horizontal Scaling</div>
<div class="two-col">
<div class="col-box"><div class="col-box-title">Vertical (Scale Up)</div><ul class="note-list">
<li>Ek machine ko powerful banao</li><li>CPU/RAM/Disk badao</li>
<li>Code change nahi hota</li><li>Hard ceiling hai</li><li>Single Point of Failure</li>
</ul></div>
<div class="col-box"><div class="col-box-title">Horizontal (Scale Out)</div><ul class="note-list">
<li>Zyada machines add karo</li><li>Load distribute karo</li>
<li>No hard ceiling</li><li>Stateless app chahiye</li><li>High availability</li>
</ul></div>
</div></div>
<div class="card"><div class="card-title">Load Balancing Algorithms</div>
<div class="arch-row"><div class="arch-label">Round Robin</div><div class="arch-val">Ek-ek karke sab servers pe request. Simple, equal distribution.</div></div>
<div class="arch-row"><div class="arch-label">Least Connections</div><div class="arch-val">Jis server pe kam active connections. Unequal requests ke liye better.</div></div>
<div class="arch-row"><div class="arch-label">IP Hash</div><div class="arch-val">Same user hamesha same server. Session affinity ke liye.</div></div>
<div class="arch-row"><div class="arch-label">Weighted RR</div><div class="arch-val">Powerful servers ko zyada requests. Heterogeneous fleet ke liye.</div></div>
<div class="warn-box"><p><strong>LB bhi SPOF hai!</strong> Active-Passive ya Active-Active LB setup karo.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Vertical vs Horizontal scaling — kab kya choose karoge?</li>
<li>Load balancer khud fail ho jaaye toh kya karoge?</li>
<li>Sticky sessions kya hote hain? Drawbacks?</li>
<li>L4 vs L7 load balancing mein kya fark hai?</li>
<li>Auto-scaling kaise kaam karta hai?</li>
</ol></div>`},
  {num:`03`,title:`Databases — SQL vs NoSQL`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">SQL (Relational)</div><ul class="note-list">
<li><strong>ACID:</strong> Atomicity, Consistency, Isolation, Durability — transactions safe</li>
<li>Fixed schema, tables, JOINs, foreign keys</li>
<li>Best for: Financial, e-commerce, structured data</li>
<li><strong>Examples:</strong> MySQL, PostgreSQL, Oracle, MS SQL</li>
</ul></div>
<div class="card"><div class="card-title">NoSQL Types</div>
<div class="arch-row"><div class="arch-label">Document</div><div class="arch-val">MongoDB — JSON docs, flexible schema. Profiles, blogs, catalogs.</div></div>
<div class="arch-row"><div class="arch-label">Key-Value</div><div class="arch-val">Redis, DynamoDB — ultra fast. Cache, sessions, shopping cart.</div></div>
<div class="arch-row"><div class="arch-label">Wide Column</div><div class="arch-val">Cassandra, HBase — time-series, IoT, analytics. Write-heavy.</div></div>
<div class="arch-row"><div class="arch-label">Graph</div><div class="arch-val">Neo4j — relationships first. Social networks, fraud detection.</div></div>
<div class="tip-box"><p><strong>BASE (NoSQL):</strong> Basically Available, Soft state, Eventually consistent. Scale bahut better karta hai SQL se.</p></div>
</div>
<div class="card"><div class="card-title">Replication & Sharding</div><ul class="note-list">
<li><strong>Master-Slave:</strong> Master writes, replicas reads — read scale badhaao</li>
<li><strong>Sharding:</strong> Data partitions mein baanto — A-M → DB1, N-Z → DB2</li>
<li><strong>Consistent Hashing:</strong> Shard add/remove pe minimum data movement</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>SQL vs NoSQL — kab kya choose karoge?</li>
<li>Database sharding kya hai? Hotspot problem kaise solve karoge?</li>
<li>ACID vs BASE — kab eventual consistency acceptable hai?</li>
<li>Read replica setup mein replication lag kaise handle karoge?</li>
<li>N+1 query problem kya hai? Fix karo.</li>
</ol></div>`},
  {num:`04`,title:`Caching`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Caching Fundamentals</div><ul class="note-list">
<li>Frequently accessed data ko <strong>fast memory (RAM)</strong> mein store karo</li>
<li>DB hits reduce → latency kam → cost save → performance boost</li>
<li><strong>Cache Hit Ratio:</strong> Hits/(Hits+Misses) — 90%+ target</li>
<li><strong>Levels:</strong> Browser → CDN → Load Balancer → App → DB</li>
</ul></div>
<div class="card"><div class="card-title">Cache Strategies</div>
<div class="arch-row"><div class="arch-label">Cache Aside</div><div class="arch-val">App cache check kare. Miss pe DB se lo, cache mein daalo. Sabse common.</div></div>
<div class="arch-row"><div class="arch-label">Write Through</div><div class="arch-val">Cache aur DB dono mein ek saath. Consistent, thoda slow writes.</div></div>
<div class="arch-row"><div class="arch-label">Write Back</div><div class="arch-val">Pehle sirf cache, async DB baad mein. Fastest, data loss risk.</div></div>
<div class="arch-row"><div class="arch-label">Refresh Ahead</div><div class="arch-val">Expiry se pehle proactively refresh. Hot data ke liye.</div></div>
</div>
<div class="card"><div class="card-title">Cache Problems</div><ul class="note-list">
<li><strong>LRU Eviction:</strong> Least Recently Used — most popular policy</li>
<li><strong>Cache Stampede:</strong> Sab ek saath miss → DB overload. Fix: mutex/lock</li>
<li><strong>Cache Penetration:</strong> Data DB mein bhi nahi. Fix: Bloom filter</li>
<li><strong>Cache Avalanche:</strong> Saara cache ek saath expire. Fix: Random TTL jitter</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Cache invalidation ke strategies kya hain?</li>
<li>Redis vs Memcached — detailed comparison karo.</li>
<li>Cache stampede kaise prevent karoge?</li>
<li>Distributed caching mein consistent hashing kaise kaam karta hai?</li>
<li>Write-through aur write-back mein consistency kaise maintain karoge?</li>
</ol></div>`},
  {num:`05`,title:`CDN & Networking`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">CDN (Content Delivery Network)</div><ul class="note-list">
<li>Static content ko <strong>geographically nearby server</strong> se serve karo</li>
<li>Mumbai user → Mumbai CDN node, US server se nahi — latency kaafi kam</li>
<li><strong>Push CDN:</strong> Content manually upload. Predictable files ke liye.</li>
<li><strong>Pull CDN:</strong> First request pe origin se fetch, cache. Dynamic ke liye.</li>
<li><strong>Examples:</strong> Cloudflare, AWS CloudFront, Akamai, Fastly</li>
</ul></div>
<div class="card"><div class="card-title">HTTP & Protocols</div>
<div class="arch-row"><div class="arch-label">HTTP/1.1</div><div class="arch-val">Sequential requests, head-of-line blocking. 6 connections per origin.</div></div>
<div class="arch-row"><div class="arch-label">HTTP/2</div><div class="arch-val">Multiplexing — multiple streams ek TCP connection. Header compression.</div></div>
<div class="arch-row"><div class="arch-label">HTTP/3</div><div class="arch-val">QUIC (UDP based) — faster, no TCP handshake overhead.</div></div>
<div class="arch-row"><div class="arch-label">WebSocket</div><div class="arch-val">Bidirectional persistent. Chat, live feeds, gaming.</div></div>
<div class="arch-row"><div class="arch-label">gRPC</div><div class="arch-val">Binary Protobuf, HTTP/2. Microservices internal communication.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>REST vs GraphQL vs gRPC — kab kya choose karoge?</li>
<li>WebSocket vs Long Polling vs SSE — comparison karo.</li>
<li>HTTPS kaise kaam karta hai? TLS handshake steps explain karo.</li>
<li>API Gateway aur Load Balancer mein kya fark hai?</li>
<li>DNS resolution ka full flow — browser se IP tak.</li>
</ol></div>`},
  {num:`06`,title:`Message Queues`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Message Queue Kya Hai?</div><ul class="note-list">
<li>Producer message deta hai, Consumer independently baad mein process karta hai</li>
<li><strong>Decoupling:</strong> Producer aur Consumer independent — ek fail toh dusra safe</li>
<li><strong>Buffer:</strong> Traffic spikes absorb karo — peak load smooth</li>
<li><strong>Async processing:</strong> Order aaya → queue → email baad mein bhejo</li>
</ul></div>
<div class="card"><div class="card-title">Popular Tools</div>
<div class="arch-row"><div class="arch-label">Apache Kafka</div><div class="arch-val">High throughput, ordered, persistent, replay. Event streaming, analytics.</div></div>
<div class="arch-row"><div class="arch-label">RabbitMQ</div><div class="arch-val">AMQP, complex routing. Traditional task queues, work distribution.</div></div>
<div class="arch-row"><div class="arch-label">AWS SQS/SNS</div><div class="arch-val">Managed, auto-scaling. SQS=queue, SNS=pub/sub fan-out.</div></div>
</div>
<div class="card"><div class="card-title">Important Patterns</div><ul class="note-list">
<li><strong>Dead Letter Queue:</strong> Failed messages alag queue mein — debug, retry</li>
<li><strong>Retry + Exponential Backoff:</strong> 1s → 2s → 4s → 8s + jitter</li>
<li><strong>Idempotent Consumer:</strong> Same message baar baar aaye toh bhi safe</li>
<li><strong>Outbox Pattern:</strong> DB transaction aur message atomically</li>
</ul>
<div class="tip-box"><p><strong>Delivery:</strong> At-most-once (loss) | At-least-once (duplicates) | Exactly-once (hardest). Usually at-least-once + idempotent consumer use karo.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Kafka vs RabbitMQ — kab kya choose karoge?</li>
<li>Exactly-once delivery kaise achieve karte hain?</li>
<li>Kafka mein message ordering kaise guarantee karte hain?</li>
<li>Circuit breaker pattern kya hai?</li>
<li>Event-driven architecture ke pros aur cons?</li>
</ol></div>`},
  {num:`07`,title:`Microservices`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Monolith vs Microservices</div>
<div class="two-col">
<div class="col-box"><div class="col-box-title">Monolith</div><ul class="note-list">
<li>Simple to start</li><li>Single deployment</li><li>One tech stack</li><li>Best for small teams</li>
</ul></div>
<div class="col-box"><div class="col-box-title">Microservices</div><ul class="note-list">
<li>Independent deploy</li><li>Scale parts only</li><li>Tech freedom</li><li>Needs mature DevOps</li>
</ul></div>
</div></div>
<div class="card"><div class="card-title">Key Patterns</div>
<div class="arch-row"><div class="arch-label">API Gateway</div><div class="arch-val">Single entry point. Auth, rate limiting, routing, SSL termination.</div></div>
<div class="arch-row"><div class="arch-label">Service Discovery</div><div class="arch-val">Dynamically register aur dhundh karein — Consul, Eureka, etcd.</div></div>
<div class="arch-row"><div class="arch-label">Circuit Breaker</div><div class="arch-val">Downstream fail ho toh cascade rokdo. Hystrix, Resilience4j.</div></div>
<div class="arch-row"><div class="arch-label">Saga Pattern</div><div class="arch-val">Distributed transactions — Choreography vs Orchestration.</div></div>
<div class="warn-box"><p><strong>Warning:</strong> Pehle monolith banao, scale hone pe split karo — Strangler Fig pattern use karo.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Distributed transactions microservices mein kaise handle karoge?</li>
<li>Service mesh kya hota hai? Istio explain karo.</li>
<li>Kab microservices se monolith pe wapas aana chahiye?</li>
<li>12-factor app principles kya hain?</li>
<li>Choreography vs Orchestration saga — kab kya?</li>
</ol></div>`},
  {num:`08`,title:`Consistent Hashing`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Problem with Normal Hashing</div><ul class="note-list">
<li>5 servers: <code>server = hash(key) % 5</code></li>
<li>6th server add karo → formula <code>% 6</code> → <strong>almost saari keys remap</strong></li>
<li>Production mein disaster — millions of cache misses ek saath</li>
</ul></div>
<div class="card"><div class="card-title">Consistent Hashing Solution</div><ul class="note-list">
<li>Servers ko ek <strong>circular ring</strong> (0 to 2³²-1) pe hash karo</li>
<li>Key ko bhi same ring pe hash karo</li>
<li>Clockwise direction mein pehla server use karo</li>
<li>Server add/remove pe sirf <strong>adjacent keys move</strong> hoti hain</li>
<li><strong>Virtual Nodes:</strong> Ek server = multiple ring positions — better load balance</li>
</ul>
<div class="tip-box"><p><strong>Production use:</strong> Cassandra, DynamoDB, Memcached, Redis Cluster — sab consistent hashing use karte hain.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Consistent hashing kaise kaam karta hai? Normal se better kyun?</li>
<li>Virtual nodes kyon use karte hain?</li>
<li>Cassandra mein data distribution kaise hoti hai?</li>
<li>Hot spot problem kaise aati hai? Fix karo.</li>
<li>LLD level pe implement karo — data structures?</li>
</ol></div>`},
  {num:`09`,title:`Rate Limiting`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Rate Limiting</div><ul class="note-list">
<li>User/IP ko limited requests — "100 req/min per user"</li>
<li>DDoS protection, fair resource sharing, cost control</li>
<li>Response: <strong>HTTP 429 Too Many Requests</strong></li>
</ul></div>
<div class="card"><div class="card-title">Algorithms</div>
<div class="arch-row"><div class="arch-label">Token Bucket</div><div class="arch-val">Bucket mein tokens, refill hote hain. Burst allow. AWS/Stripe use karte hain.</div></div>
<div class="arch-row"><div class="arch-label">Leaky Bucket</div><div class="arch-val">Fixed rate output. Smooth traffic, burst buffer.</div></div>
<div class="arch-row"><div class="arch-label">Fixed Window</div><div class="arch-val">Har 1 min mein reset. Simple but boundary pe double req possible.</div></div>
<div class="arch-row"><div class="arch-label">Sliding Window</div><div class="arch-val">Last 1 min accurately track. Accurate but memory zyada.</div></div>
</div>
<div class="card"><div class="card-title">Distributed Rate Limiting</div><ul class="note-list">
<li>Multiple app servers → centralized counter → <strong>Redis</strong> use karo</li>
<li>Redis INCR + EXPIRE — atomic, fast, distributed</li>
<li>Lua scripts — multiple operations atomically</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Token bucket vs leaky bucket — difference aur use cases.</li>
<li>Distributed rate limiting ka Redis implementation karo.</li>
<li>Fixed window ka edge case attack kya hai?</li>
<li>Different users ke liye different tiers kaise implement karoge?</li>
<li>1 million req/sec rate limit system design karo.</li>
</ol></div>`},
  {num:`10`,title:`Storage Systems`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Storage Types</div>
<div class="arch-row"><div class="arch-label">Block Storage</div><div class="arch-val">Raw blocks, low latency. OS aur DBs use karte hain. AWS EBS.</div></div>
<div class="arch-row"><div class="arch-label">File Storage</div><div class="arch-val">File system hierarchy, shared access. AWS EFS, NFS.</div></div>
<div class="arch-row"><div class="arch-label">Object Storage</div><div class="arch-val">Flat key-value, infinite scale, cheap. AWS S3, GCS. Photos, videos, backups.</div></div>
<div class="arch-row"><div class="arch-label">In-Memory</div><div class="arch-val">RAM-based, ultra fast. Redis, Memcached. Cache, sessions.</div></div>
</div>
<div class="card"><div class="card-title">AWS S3 Deep Dive</div><ul class="note-list">
<li>11 nines durability (99.999999999%)</li>
<li><strong>Pre-signed URLs:</strong> Temporary direct upload/download without server</li>
<li><strong>Storage classes:</strong> Standard → Standard-IA → Glacier → Deep Archive</li>
<li><strong>Multipart Upload:</strong> Large files chunks mein upload (5GB+ ke liye)</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>1 billion user photo storage system design karo.</li>
<li>Pre-signed URL kya hota hai? Security implications?</li>
<li>Object storage vs block storage — kab kya?</li>
<li>Large file upload (10GB video) efficiently kaise handle karoge?</li>
<li>Google Drive jaisa system design karo.</li>
</ol></div>`},
  {num:`11`,title:`Search Systems`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Why Not SQL for Search?</div><ul class="note-list">
<li>SQL <code>LIKE "%query%"</code> — full table scan, O(n), no ranking</li>
<li>No fuzzy matching, no relevance scoring, no stemming</li>
</ul></div>
<div class="card"><div class="card-title">Inverted Index & Elasticsearch</div><ul class="note-list">
<li>Forward: Doc→Words | Inverted: <strong>Word → Documents list</strong></li>
<li>"system"→[doc1,doc3] | "design"→[doc1,doc7] → intersection → rank</li>
<li><strong>TF-IDF / BM25:</strong> Relevance scoring algorithms</li>
<li>Cluster → Nodes → Indices → Shards — horizontally scalable</li>
</ul>
<div class="tip-box"><p><strong>Common pattern:</strong> Primary DB (MySQL) + Elasticsearch for search. CDC (Debezium) se sync karo.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Twitter search system design karo.</li>
<li>Inverted index kya hota hai? Kaise build hoti hai?</li>
<li>Autocomplete feature design karo — Trie vs Elasticsearch?</li>
<li>Multi-language search kaise handle karoge?</li>
<li>Elasticsearch vs SQL full-text search — kab kya?</li>
</ol></div>`},
  {num:`12`,title:`Distributed Systems`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Core Concepts</div>
<div class="arch-row"><div class="arch-label">Consensus</div><div class="arch-val">Nodes agree kaise karein — Raft (understandable), Paxos (complex).</div></div>
<div class="arch-row"><div class="arch-label">Leader Election</div><div class="arch-val">Ek node leader bane — ZooKeeper, etcd, Raft built-in.</div></div>
<div class="arch-row"><div class="arch-label">Vector Clocks</div><div class="arch-val">Events ka causal order track karo without global clock.</div></div>
<div class="arch-row"><div class="arch-label">Gossip Protocol</div><div class="arch-val">Epidemic style info spread. Cassandra, DynamoDB use karte hain.</div></div>
<div class="arch-row"><div class="arch-label">Quorum</div><div class="arch-val">N nodes mein majority (N/2+1) se agree karo.</div></div>
</div>
<div class="card"><div class="card-title">Consistency Models</div><ul class="note-list">
<li><strong>Strong Consistency:</strong> Write ke baad read hamesha latest data — slow, banks</li>
<li><strong>Eventual Consistency:</strong> Eventually sab nodes agree — fast, social media</li>
<li><strong>Read-Your-Writes:</strong> Apna likhaa khud padh sako — UX ke liye zaroori</li>
<li><strong>Split Brain:</strong> Network partition → dono sides leader ban jaate hain — dangerous!</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Raft vs Paxos — high-level comparison karo.</li>
<li>Split brain problem kya hai? Kaise resolve karoge?</li>
<li>Eventual consistency kab acceptable hai?</li>
<li>Two Generals Problem kya hai?</li>
<li>Network partition ke time available rehna better ya consistent?</li>
</ol></div>`},
  {num:`13`,title:`Design Patterns`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Architectural Patterns</div>
<div class="arch-row"><div class="arch-label">CQRS</div><div class="arch-val">Command Query Responsibility Segregation — reads aur writes alag.</div></div>
<div class="arch-row"><div class="arch-label">Event Sourcing</div><div class="arch-val">State ke bajay events store karo. Full audit trail, replay possible.</div></div>
<div class="arch-row"><div class="arch-label">Outbox Pattern</div><div class="arch-val">DB transaction + message publish atomically. Dual write avoid.</div></div>
<div class="arch-row"><div class="arch-label">Strangler Fig</div><div class="arch-val">Monolith gradually microservices mein migrate karo.</div></div>
<div class="arch-row"><div class="arch-label">Bulkhead</div><div class="arch-val">Resources isolate karo — ek failure baaki ko affect na kare.</div></div>
</div>
<div class="card"><div class="card-title">Resilience Patterns</div><ul class="note-list">
<li><strong>Circuit Breaker:</strong> Closed → Open → Half-Open states</li>
<li><strong>Retry with Jitter:</strong> Random delay — thundering herd avoid</li>
<li><strong>Timeout:</strong> Har external call pe timeout — hanging requests rokne ke liye</li>
<li><strong>Fallback:</strong> Service fail → cached/default response</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>CQRS kab use karein? Complexity worth hai kab?</li>
<li>Event sourcing vs traditional CRUD — pros/cons?</li>
<li>Circuit breaker ke teen states explain karo.</li>
<li>Outbox pattern dual-write problem kaise solve karta hai?</li>
<li>Change Data Capture kya hai?</li>
</ol></div>`},
  {num:`14`,title:`Classic System Designs`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Instagram / Photo Sharing</div><ul class="note-list">
<li><strong>Upload:</strong> Client → API → S3 → CDN</li>
<li><strong>Fanout on Write:</strong> Normal accounts — post pe followers ka feed update</li>
<li><strong>Fanout on Read:</strong> Celebrities (millions followers) — read time pe generate</li>
<li>Timeline: Redis sorted sets, score=timestamp</li>
</ul></div>
<div class="card"><div class="card-title">WhatsApp / Uber / URL Shortener</div><ul class="note-list">
<li><strong>Chat:</strong> WebSocket — bidirectional real-time, E2E Encryption (Signal Protocol)</li>
<li><strong>Uber:</strong> Every 4 sec driver location → Geohash/QuadTree spatial indexing</li>
<li><strong>URL Shortener:</strong> Base62 (a-z,A-Z,0-9) — 7 chars = 3.5 trillion URLs</li>
<li><strong>301 vs 302:</strong> 301=permanent (browser cache) | 302=temporary (analytics)</li>
</ul></div>
<div class="q-section"><div class="q-title">Top Interview Design Questions</div><ol class="q-list">
<li>Design Twitter — news feed, followers, trending topics.</li>
<li>Design a Distributed Cache (Redis-like) from scratch.</li>
<li>Design YouTube — upload, transcoding, adaptive streaming.</li>
<li>Design Notification System — push, email, SMS at 1B users.</li>
<li>Design Distributed Rate Limiter at 1M req/sec.</li>
<li>Design Gaming Leaderboard — real-time global rankings.</li>
</ol></div>`},
  {num:`15`,title:`Interview Strategy`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">45-Minute Framework</div>
<div class="arch-row"><div class="arch-label">0–5 min</div><div class="arch-val">Requirements clarify karo — Functional + Non-Functional (scale, latency)</div></div>
<div class="arch-row"><div class="arch-label">5–10 min</div><div class="arch-val">Scale estimate — DAU, QPS, storage, bandwidth calculate karo</div></div>
<div class="arch-row"><div class="arch-label">10–20 min</div><div class="arch-val">High-level design — APIs, data models, major components</div></div>
<div class="arch-row"><div class="arch-label">20–35 min</div><div class="arch-val">Deep dive — bottlenecks identify karo, scale karo, edge cases</div></div>
<div class="arch-row"><div class="arch-label">35–45 min</div><div class="arch-val">Trade-offs discuss karo, failures, monitoring, improvements</div></div>
</div>
<div class="card"><div class="card-title">Golden Rules</div><ul class="note-list">
<li>Pehle <strong>requirements clarify</strong> karo — assume mat karo, puchho</li>
<li><strong>Simplest solution pehle</strong>, phir optimize</li>
<li>Trade-offs openly discuss karo</li>
<li>Numbers bolte raho — "1M DAU, 1000 QPS, 1TB/day"</li>
<li><strong>Interviewer engage karo</strong> — dialogue, monologue nahi</li>
</ul>
<div class="tip-box"><p><strong>Checklist:</strong> DNS → CDN → Load Balancer → API Gateway → App Servers → Cache (Redis) → Primary DB → Read Replicas → Message Queue → Background Workers → Object Storage (S3)</p></div>
</div>
<div class="card"><div class="card-title">Must-Read Resources</div>
<div class="chips">
<span class="chip">📘 Alex Xu — System Design Interview Vol 1 & 2</span>
<span class="chip">📗 Designing Data-Intensive Apps (DDIA)</span>
<span class="chip">🌐 ByteByteGo Newsletter</span>
<span class="chip">📰 High Scalability Blog</span>
<span class="chip">💻 github: system-design-primer</span>
<span class="chip">🎥 Gaurav Sen YouTube</span>
</div></div>
<div class="q-section"><div class="q-title">Advanced Questions</div><ol class="q-list">
<li>System ke bottlenecks kaise systematically identify karte hain?</li>
<li>Zero-downtime database migration kaise karoge at scale?</li>
<li>Multi-region deployment mein data consistency kaise handle karoge?</li>
<li>Disaster recovery plan — RTO aur RPO define karo.</li>
<li>Observability — metrics, logs, traces — kaise setup karoge?</li>
</ol></div>`}
  ],
  git: [
  {num:`01`,title:`Git Kya Hai? — Basics`,level:`Git Basics`,badge:`fund`,html:`
<div class="card"><div class="card-title">Git kya hai?</div><ul class="note-list">
<li><strong>VCS (Version Control System):</strong> Code ka history track karo — kab kya change hua</li>
<li><strong>Distributed:</strong> Har developer ke paas poora repository — offline kaam karo</li>
<li><strong>Linus Torvalds</strong> ne 2005 mein banaya — Linux kernel ke liye</li>
<li>GitHub/GitLab/Bitbucket = Git ke upar cloud hosting + collaboration</li>
<li><strong>Git ≠ GitHub</strong> — Git ek tool hai, GitHub ek platform hai</li>
</ul></div>
<div class="card"><div class="card-title">Git ke 3 States</div>
<div class="flow">
<div class="flow-box red">Working Directory</div>
<div class="flow-arrow">→</div>
<div class="flow-box" style="border-color:rgba(124,106,247,0.4);color:#a998ff;background:rgba(124,106,247,0.08)">Staging Area</div>
<div class="flow-arrow">→</div>
<div class="flow-box green">Repository (.git)</div>
</div>
<ul class="note-list" style="margin-top:12px">
<li><strong>Working Directory:</strong> Files jinhe abhi edit kar rahe ho — "modified"</li>
<li><strong>Staging Area:</strong> <code>git add</code> ke baad — commit ke liye ready</li>
<li><strong>Repository:</strong> <code>git commit</code> ke baad — permanently saved</li>
</ul></div>
<div class="card"><div class="card-title">Setup Commands</div>
<div class="cmd-block">
<div><span class="cmt"># Configure karo</span></div>
<div><span class="cmd">git config</span> <span class="fl">--global</span> user.name <span class="str">"Tumhara Naam"</span></div>
<div><span class="cmd">git config</span> <span class="fl">--global</span> user.email <span class="str">"email@example.com"</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># Repo banana / clone karna</span></div>
<div><span class="cmd">git init</span></div>
<div><span class="cmd">git clone</span> <span class="str">https://github.com/user/repo.git</span></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Git aur GitHub mein kya fark hai?</li>
<li>Distributed VCS vs Centralized VCS (SVN) — benefits?</li>
<li>Git ke 3 states kya hain? File kaise move karti hai?</li>
<li><code>git init</code> se kya hota hai? .git folder mein kya hota hai?</li>
<li>Pehli baar GitHub se connect karne ke steps?</li>
</ol></div>`},
  {num:`02`,title:`Basic Commands`,level:`Git Basics`,badge:`fund`,html:`
<div class="card"><div class="card-title">Daily Use Commands</div>
<div class="cmd-block">
<div><span class="cmt"># Status check karo</span></div>
<div><span class="cmd">git status</span> <span class="fl">-s</span>                 <span class="out"># short format</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># Staging</span></div>
<div><span class="cmd">git add</span> <span class="fl">.</span>                   <span class="out"># sab files</span></div>
<div><span class="cmd">git add</span> <span class="fl">-p</span>                  <span class="out"># interactive hunks</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># Commit</span></div>
<div><span class="cmd">git commit</span> <span class="fl">-m</span> <span class="str">"feat: login add kiya"</span></div>
<div><span class="cmd">git commit</span> <span class="fl">--amend</span>             <span class="out"># last commit modify karo</span></div>
</div></div>
<div class="card"><div class="card-title">History, Diff & Discard</div>
<div class="cmd-block">
<div><span class="cmd">git log</span> <span class="fl">--oneline --graph --all</span>  <span class="out"># visual tree</span></div>
<div><span class="cmd">git diff</span>                     <span class="out"># working vs staged</span></div>
<div><span class="cmd">git diff</span> <span class="fl">--staged</span>            <span class="out"># staged vs last commit</span></div>
<div>&nbsp;</div>
<div><span class="cmd">git restore</span> <span class="fl">--staged</span> <span class="str">file.txt</span> <span class="out"># unstage karo</span></div>
<div><span class="cmd">git restore</span> <span class="str">file.txt</span>         <span class="out"># discard changes (permanent!)</span></div>
</div>
<div class="warn-box"><p><strong>Caution:</strong> <code>git restore file.txt</code> permanently changes discard karta hai — undo nahi hoga!</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li><code>git add -p</code> kyun use karte hain? <code>git add .</code> se better kab?</li>
<li><code>git commit --amend</code> kab use karein? Kab nahi?</li>
<li>Staged changes ko unstage karne ke 2 tarike batao.</li>
<li>Good commit message kaise likhte hain? Conventional Commits?</li>
<li><code>git log --oneline --graph --all</code> se kya milta hai?</li>
</ol></div>`},
  {num:`03`,title:`Branching Strategy`,level:`Git Basics`,badge:`fund`,html:`
<div class="card"><div class="card-title">Branch Commands</div>
<div class="cmd-block">
<div><span class="cmd">git switch</span> <span class="fl">-c</span> <span class="str">feature/login</span>   <span class="out"># banao + switch (modern)</span></div>
<div><span class="cmd">git checkout</span> <span class="fl">-b</span> <span class="str">feature/login</span>  <span class="out"># purana syntax</span></div>
<div><span class="cmd">git switch</span> <span class="str">main</span>              <span class="out"># switch karo</span></div>
<div><span class="cmd">git branch</span> <span class="fl">-d</span> <span class="str">feature/login</span>   <span class="out"># safe delete</span></div>
<div><span class="cmd">git branch</span> <span class="fl">-a</span>               <span class="out"># sab branches (remote bhi)</span></div>
</div></div>
<div class="card"><div class="card-title">Branching Strategies</div>
<div class="arch-row"><div class="arch-label">Git Flow</div><div class="arch-val">main + develop + feature/* + release/* + hotfix/*. Complex, versioned software.</div></div>
<div class="arch-row"><div class="arch-label">GitHub Flow</div><div class="arch-val">main + feature branches → PR → merge. Simple, CI/CD ke liye best.</div></div>
<div class="arch-row"><div class="arch-label">Trunk-Based</div><div class="arch-val">Sab direct main pe. Short-lived branches + feature flags. Google/Meta use karte hain.</div></div>
<div class="arch-row"><div class="arch-label">GitLab Flow</div><div class="arch-val">Environment branches (staging, production). Deploy-heavy teams ke liye.</div></div>
</div>
<div class="card"><div class="card-title">Branch Naming</div>
<div class="chips">
<span class="chip">feature/user-auth</span><span class="chip">fix/login-bug</span>
<span class="chip">hotfix/payment-crash</span><span class="chip">release/v2.1.0</span>
<span class="chip">chore/update-deps</span><span class="chip">feat/JIRA-123-login</span>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Git Flow vs GitHub Flow — kab kya? Pros/cons?</li>
<li>Trunk-based development kyun popular ho raha hai?</li>
<li>Long-lived feature branches ke kya problems hain?</li>
<li>Branch protection rules kya hoti hain?</li>
<li>Merge conflict avoid karne ki strategies?</li>
</ol></div>`},
  {num:`04`,title:`Merge & Rebase`,level:`Git Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">git merge</div>
<div class="cmd-block">
<div><span class="cmd">git merge</span> <span class="str">feature/login</span>       <span class="out"># current branch mein merge</span></div>
<div><span class="cmd">git merge</span> <span class="fl">--no-ff</span> <span class="str">feature</span>   <span class="out"># hamesha merge commit</span></div>
<div><span class="cmd">git merge</span> <span class="fl">--squash</span> <span class="str">feature</span>  <span class="out"># sab commits ek mein</span></div>
<div><span class="cmd">git merge</span> <span class="fl">--abort</span>          <span class="out"># conflict pe cancel</span></div>
</div></div>
<div class="card"><div class="card-title">git rebase</div>
<div class="cmd-block">
<div><span class="cmd">git rebase</span> <span class="str">main</span>              <span class="out"># main ke top pe rebase</span></div>
<div><span class="cmd">git rebase</span> <span class="fl">-i</span> <span class="str">HEAD~3</span>         <span class="out"># interactive — last 3 edit</span></div>
<div><span class="out"># pick=rakhna | squash=combine | reword=msg | drop=delete</span></div>
<div><span class="cmd">git rebase</span> <span class="fl">--continue</span>        <span class="out"># conflict solve ke baad</span></div>
<div><span class="cmd">git rebase</span> <span class="fl">--abort</span></div>
</div>
<div class="warn-box"><p><strong>Golden Rule:</strong> Shared/public branches pe rebase mat karo — teammates ki history corrupt ho jaati hai!</p></div>
</div>
<div class="card"><div class="card-title">Merge vs Rebase</div>
<div class="two-col">
<div class="col-box"><div class="col-box-title">git merge</div><ul class="note-list">
<li>Non-destructive, safe</li><li>Merge commits bante hain</li><li>Full history preserved</li><li>Shared branches ke liye</li>
</ul></div>
<div class="col-box"><div class="col-box-title">git rebase</div><ul class="note-list">
<li>Linear clean history</li><li>No merge commits</li><li>History rewrite hoti hai</li><li>Sirf private branches</li>
</ul></div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Merge vs Rebase — kab kya? Trade-offs explain karo.</li>
<li>Interactive rebase mein squash vs fixup mein kya fark?</li>
<li>Fast-forward merge kab hota hai? --no-ff kyun?</li>
<li>"Rebase public pe mat karo" — exactly kya happen hoga?</li>
<li>Merge conflict kaise resolve karte hain?</li>
</ol></div>`},
  {num:`05`,title:`Remote & GitHub`,level:`Git Basics`,badge:`fund`,html:`
<div class="card"><div class="card-title">Remote Commands</div>
<div class="cmd-block">
<div><span class="cmd">git remote</span> <span class="fl">-v</span>                  <span class="out"># remotes dekho</span></div>
<div><span class="cmd">git remote add</span> <span class="str">origin URL</span></div>
<div>&nbsp;</div>
<div><span class="cmd">git push</span> <span class="fl">-u</span> <span class="str">origin main</span>     <span class="out"># upstream set + push</span></div>
<div><span class="cmd">git push</span> <span class="fl">--force-with-lease</span>   <span class="out"># safe force push</span></div>
<div><span class="cmd">git pull</span> <span class="fl">--rebase</span>            <span class="out"># fetch + rebase (cleaner)</span></div>
<div><span class="cmd">git fetch</span> <span class="str">origin</span>            <span class="out"># sirf download, merge nahi</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># SSH key generate karo</span></div>
<div><span class="cmd">ssh-keygen</span> <span class="fl">-t ed25519 -C</span> <span class="str">"email@example.com"</span></div>
</div></div>
<div class="card"><div class="card-title">GitHub Key Features</div>
<div class="arch-row"><div class="arch-label">Pull Request</div><div class="arch-val">Code review + merge request. CI checks run hote hain.</div></div>
<div class="arch-row"><div class="arch-label">Fork</div><div class="arch-val">Kisi aur ka repo apne account mein copy. Open source contribution.</div></div>
<div class="arch-row"><div class="arch-label">Issues</div><div class="arch-val">Bug reports, feature requests. Labels, milestones, assignees.</div></div>
<div class="arch-row"><div class="arch-label">GitHub Actions</div><div class="arch-val">CI/CD automation — tests, builds, deployments on push/PR.</div></div>
<div class="tip-box"><p><strong>SSH prefer karo</strong> — password baar baar nahi daalna, token expiry issue nahi hota.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li><code>git fetch</code> vs <code>git pull</code> — exact difference?</li>
<li><code>git push --force</code> vs <code>--force-with-lease</code> — kya fark?</li>
<li>Fork vs Clone vs Branch — kab kya?</li>
<li>SSH aur HTTPS authentication mein kya fark?</li>
<li>Open source project mein contribute karne ka full flow?</li>
</ol></div>`},
  {num:`06`,title:`Stash & Cherry-pick`,level:`Git Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">git stash</div>
<div class="cmd-block">
<div><span class="cmd">git stash</span>                    <span class="out"># current changes stash karo</span></div>
<div><span class="cmd">git stash push</span> <span class="fl">-m</span> <span class="str">"login wip"</span></div>
<div><span class="cmd">git stash</span> <span class="fl">-u</span>               <span class="out"># untracked files bhi include</span></div>
<div><span class="cmd">git stash list</span></div>
<div><span class="cmd">git stash pop</span>                <span class="out"># latest apply + delete</span></div>
<div><span class="cmd">git stash apply stash@{2}</span>    <span class="out"># specific apply (delete nahi)</span></div>
<div><span class="cmd">git stash drop stash@{0}</span></div>
<div><span class="cmd">git stash clear</span></div>
</div>
<div class="info-box"><p><strong>Use Case:</strong> Urgent hotfix karna ho mid-work — stash karo, fix karo, wapas pop karo.</p></div>
</div>
<div class="card"><div class="card-title">git cherry-pick</div>
<div class="cmd-block">
<div><span class="cmt"># Specific commit current branch pe lao</span></div>
<div><span class="cmd">git cherry-pick</span> <span class="str">abc1234</span></div>
<div><span class="cmd">git cherry-pick</span> <span class="str">abc123 def456</span> <span class="out"># multiple</span></div>
<div><span class="cmd">git cherry-pick</span> <span class="fl">-n</span> <span class="str">abc123</span>   <span class="out"># apply but dont commit</span></div>
<div><span class="cmd">git cherry-pick</span> <span class="fl">--abort</span></div>
</div><ul class="note-list" style="margin-top:10px">
<li><strong>Use:</strong> Hotfix ko multiple release branches pe apply karna</li>
<li><strong>Use:</strong> Wrong branch pe commit kiya — sahi branch pe le jao</li>
</ul>
<div class="warn-box"><p><strong>Over-use avoid karo:</strong> Duplicate commits banata hai. Full merge prefer karo.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Stash pop vs stash apply — kya fark hai?</li>
<li>Cherry-pick kab use karoge? Real-world scenario do.</li>
<li>Hotfix ko multiple release branches pe kaise apply karoge?</li>
<li>Cherry-pick ke baad original branch se merge karo toh kya hoga?</li>
<li>Multiple stashes mein specific stash kaise find karoge?</li>
</ol></div>`},
  {num:`07`,title:`Reset, Revert & Reflog`,level:`Git Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">git reset</div>
<div class="cmd-block">
<div><span class="cmt"># Soft — commits undo, changes staged rehte hain</span></div>
<div><span class="cmd">git reset</span> <span class="fl">--soft</span> <span class="str">HEAD~1</span></div>
<div><span class="cmt"># Mixed (default) — commits undo, changes working dir mein</span></div>
<div><span class="cmd">git reset</span> <span class="str">HEAD~2</span></div>
<div><span class="cmt"># Hard — sab undo (DANGEROUS!)</span></div>
<div><span class="cmd">git reset</span> <span class="fl">--hard</span> <span class="str">HEAD~3</span></div>
<div><span class="cmd">git reset</span> <span class="fl">--hard</span> <span class="str">origin/main</span></div>
</div>
<div class="warn-box"><p><strong>Danger:</strong> Hard reset mein uncommitted changes permanently lost! Shared branch pe kabhi mat karo.</p></div>
</div>
<div class="card"><div class="card-title">git revert — Safe Undo</div>
<div class="cmd-block">
<div><span class="cmd">git revert</span> <span class="str">abc1234</span>          <span class="out"># naya undo commit banata hai</span></div>
<div><span class="cmd">git revert</span> <span class="fl">--no-commit</span> <span class="str">abc</span>  <span class="out"># stage karo, baad mein commit</span></div>
</div>
<div class="arch-row" style="margin-top:10px"><div class="arch-label">git reset</div><div class="arch-val">History rewrite. Sirf private branches. Shared pe kabhi nahi.</div></div>
<div class="arch-row"><div class="arch-label">git revert</div><div class="arch-val">Safe undo — new commit. Public branches pe yahi use karo.</div></div>
</div>
<div class="card"><div class="card-title">git reflog — Time Machine</div>
<div class="cmd-block">
<div><span class="cmd">git reflog</span>                  <span class="out"># sab HEAD movements (90 days)</span></div>
<div><span class="cmt"># Hard reset ke baad recover!</span></div>
<div><span class="cmd">git reset</span> <span class="fl">--hard</span> <span class="str">HEAD@{2}</span>  <span class="out"># us point pe wapas</span></div>
<div><span class="cmt"># Deleted branch recover karo</span></div>
<div><span class="cmd">git checkout</span> <span class="fl">-b</span> <span class="str">recovered abc1234</span></div>
</div>
<div class="tip-box"><p><strong>Reflog = Safety Net!</strong> 90 days tak sab movements store hain. Kuch bhi galat ho — reflog pehle check karo.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Reset --soft vs --mixed vs --hard — exact difference?</li>
<li>Public branch pe galat commit push ho gaya — kaise fix karoge?</li>
<li>git reflog kya hota hai? Real scenario mein kab kaam aata hai?</li>
<li>Galti se <code>git reset --hard</code> kar diya — recover kaise karoge?</li>
<li>git revert se multiple commits ek saath kaise revert karoge?</li>
</ol></div>`},
  {num:`08`,title:`GitHub Actions CI/CD`,level:`Git Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">GitHub Actions Kya Hai?</div><ul class="note-list">
<li>GitHub ka built-in <strong>CI/CD automation platform</strong> — .yml files se configure</li>
<li>Push/PR pe automatically tests run karo, build karo, deploy karo</li>
<li>Hierarchy: <strong>Workflow → Jobs → Steps</strong></li>
<li>2000+ pre-built actions marketplace mein available</li>
</ul></div>
<div class="card"><div class="card-title">Basic Workflow YAML</div>
<div class="cmd-block">
<div><span class="cmt"># .github/workflows/ci.yml</span></div>
<div><span class="str">name</span>: CI Pipeline</div>
<div><span class="str">on</span>:</div>
<div>  <span class="str">push</span>: <span class="fl">branches: [main]</span></div>
<div>  <span class="str">pull_request</span>: <span class="fl">branches: [main]</span></div>
<div><span class="str">jobs</span>:</div>
<div>  <span class="str">test</span>:</div>
<div>    <span class="str">runs-on</span>: ubuntu-latest</div>
<div>    <span class="str">steps</span>:</div>
<div>      - <span class="str">uses</span>: actions/checkout@v4</div>
<div>      - <span class="str">uses</span>: actions/setup-node@v4</div>
<div>        <span class="str">with</span>: <span class="fl">{node-version: "20"}</span></div>
<div>      - <span class="str">run</span>: npm ci && npm test</div>
</div></div>
<div class="card"><div class="card-title">Common Patterns</div>
<div class="arch-row"><div class="arch-label">Matrix Build</div><div class="arch-val">Multiple Node versions parallel test. <code>strategy.matrix.node: [18,20,22]</code></div></div>
<div class="arch-row"><div class="arch-label">Secrets</div><div class="arch-val">API keys secure storage. <code>\${{ secrets.AWS_KEY }}</code> se use karo.</div></div>
<div class="arch-row"><div class="arch-label">Cache</div><div class="arch-val"><code>actions/cache</code> se node_modules cache — builds fast.</div></div>
<div class="arch-row"><div class="arch-label">Environments</div><div class="arch-val">Staging/production with manual approval gates.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>GitHub Actions ka workflow YAML structure explain karo.</li>
<li>Secrets ko GitHub Actions mein securely kaise use karte hain?</li>
<li>Matrix strategy kya hoti hai? Kab use karein?</li>
<li>Deployment workflow mein manual approval kaise add karoge?</li>
<li>GitHub Actions vs Jenkins vs CircleCI — kab kya?</li>
</ol></div>`},
  {num:`09`,title:`Pull Requests & Review`,level:`Git Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">PR Best Practices</div><ul class="note-list">
<li><strong>Small PRs:</strong> 200-400 lines max — easy to review, fast to merge</li>
<li><strong>Good Title:</strong> <code>[feat] Add user authentication with JWT</code></li>
<li><strong>Description:</strong> Kya change, kyun, kaise test karein, screenshots</li>
<li><strong>Link Issues:</strong> <code>Closes #123</code> — PR merge pe auto-close</li>
<li><strong>Self Review:</strong> Submit se pehle khud file by file dekho</li>
</ul></div>
<div class="card"><div class="card-title">Merge Strategies</div>
<div class="arch-row"><div class="arch-label">Merge Commit</div><div class="arch-val">Full history preserve. Branch context dikhta hai. Complex projects.</div></div>
<div class="arch-row"><div class="arch-label">Squash Merge</div><div class="arch-val">Sab commits ek mein. Clean main branch. Small PRs ke liye best.</div></div>
<div class="arch-row"><div class="arch-label">Rebase Merge</div><div class="arch-val">Linear history, no merge commit. PR commits directly main pe.</div></div>
<div class="tip-box"><p><strong>Team standard decide karo</strong> — sab ek hi strategy use karein. Squash merge most popular hai.</p></div>
</div>
<div class="card"><div class="card-title">GitHub Security</div>
<div class="arch-row"><div class="arch-label">Branch Protection</div><div class="arch-val">Direct push band, PR + review mandatory, CI must pass.</div></div>
<div class="arch-row"><div class="arch-label">Dependabot</div><div class="arch-val">Vulnerable dependencies auto-detect + PR raise karo.</div></div>
<div class="arch-row"><div class="arch-label">Secret Scanning</div><div class="arch-val">Committed API keys, passwords auto-detect karta hai.</div></div>
<div class="arch-row"><div class="arch-label">CODEOWNERS</div><div class="arch-val">.github/CODEOWNERS — specific paths ke liye auto reviewers.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Good PR kaise likhte hain? Kya kya include karna chahiye?</li>
<li>Code review mein kya check karte hain? Priority order?</li>
<li>Reviewer ne wrong suggestion diya — kaise handle karoge?</li>
<li>Squash merge vs regular merge vs rebase — kab kya?</li>
<li>Production repo ko secure kaise rakho?</li>
</ol></div>`},
  {num:`10`,title:`Advanced Git & Tips`,level:`Git Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Advanced Commands</div>
<div class="cmd-block">
<div><span class="cmt"># Bug binary search</span></div>
<div><span class="cmd">git bisect start</span></div>
<div><span class="cmd">git bisect bad</span>               <span class="out"># current broken</span></div>
<div><span class="cmd">git bisect good</span> <span class="str">v1.0.0</span></div>

let activeCourse = null;
let cur = 0;

// ── HOME SCREEN ──────────────────────────────────────────────────────────────
function buildHome() {
  const grid = document.getElementById('courseGrid');
  grid.innerHTML = '';
  COURSES.forEach(function(c) {
    const card = document.createElement('div');
    card.className = 'course-card ' + c.id;
    card.style.setProperty('--c-accent', c.accent);
    card.innerHTML =
      '<span class="c-icon">' + c.icon + '</span>' +
      '<div class="c-title">' + c.title + '</div>' +
      '<div class="c-desc">' + c.desc + '</div>' +
      '<span class="c-count">' + (c.count > 0 ? c.count + ' Topics' : 'Coming Soon') + '</span>' +
      '<span class="c-arrow">→</span>';
    if (c.count > 0) {
      card.onclick = function() { openCourse(c.id); };
    } else {
      card.style.opacity = '0.6';
      card.style.cursor = 'default';
    }
    grid.appendChild(card);
  });
}

// ── OPEN COURSE ──────────────────────────────────────────────────────────────
function openCourse(courseId) {
  activeCourse = COURSES.find(function(c){ return c.id === courseId; });
  cur = 0;

  // Set accent CSS variables
  document.documentElement.style.setProperty('--accent-color', activeCourse.accent);
  document.documentElement.style.setProperty('--accent-bg', activeCourse.accentBg);
  document.documentElement.style.setProperty('--accent-tab-bg', activeCourse.accentTabBg);
  document.documentElement.style.setProperty('--accent-border', activeCourse.accentBorder);
  document.documentElement.style.setProperty('--accent-row-bg', activeCourse.accentRowBg);
  document.documentElement.style.setProperty('--accent-dim', activeCourse.accentDim);

  // Set titles
  document.getElementById('sidebarTitle').textContent = activeCourse.icon + ' ' + activeCourse.title;
  document.getElementById('mobileTitle').textContent = activeCourse.icon + ' ' + activeCourse.title;

  // Switch screens
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('notesScreen').style.display = 'block';

  buildTabs();
  buildNav();
  buildSections();
  updateProgress();
}

// ── GO HOME ───────────────────────────────────────────────────────────────────
function goHome() {
  document.getElementById('notesScreen').style.display = 'none';
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('sections').innerHTML = '';
  document.getElementById('tabBar').innerHTML = '';
  document.getElementById('navList').innerHTML = '';
  closeSidebar();
}

// ── BUILD TABS ────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  const labels = activeCourse.tabLabels;
  const topics = TOPICS[activeCourse.id];
  topics.forEach(function(t, i) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === cur ? ' active' : '');
    btn.innerHTML = '<span class="t-num">' + t.num + '</span><span class="t-label">' + (labels[i] || t.title.substring(0,9)) + '</span>';
    btn.onclick = (function(idx){ return function(){ go(idx); }; })(i);
    bar.appendChild(btn);
  });
}

// ── BUILD NAV ─────────────────────────────────────────────────────────────────
function buildNav() {
  const navList = document.getElementById('navList');
  navList.innerHTML = '';
  const topics = TOPICS[activeCourse.id];
  const groups = [
    {label: '🟢 Basics / Fundamentals', badge: 'fund'},
    {label: '🔵 Intermediate',          badge: 'inter'},
    {label: '🔴 Advanced',              badge: 'adv'}
  ];
  groups.forEach(function(g) {
    const filtered = topics.filter(function(t){ return t.badge === g.badge; });
    if (filtered.length === 0) return;
    const lbl = document.createElement('div');
    lbl.className = 'nav-group-label';
    lbl.textContent = g.label;
    navList.appendChild(lbl);
    filtered.forEach(function(t) {
      const idx = topics.indexOf(t);
      const a = document.createElement('a');
      a.href = '#';
      a.className = 'nav-item' + (idx === cur ? ' active' : '');
      a.innerHTML = '<span class="nav-num">' + t.num + '</span>' + t.title +
        '<span class="nav-badge badge-' + t.badge + '">' + t.level.substring(0,7) + '</span>';
      a.onclick = (function(i){ return function(e){ e.preventDefault(); go(i); closeSidebar(); }; })(idx);
      navList.appendChild(a);
    });
  });
}

// ── BUILD SECTIONS ────────────────────────────────────────────────────────────
function buildSections() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  const topics = TOPICS[activeCourse.id];
  const levelColors = {fund:'#3ecf8e', inter:'#f7b955', adv:'#f77c6a'};
  const levelBg    = {fund:'rgba(62,207,142,0.12)', inter:'rgba(247,185,85,0.12)', adv:'rgba(247,124,106,0.12)'};
  topics.forEach(function(t, i) {
    const div = document.createElement('div');
    div.className = 'section' + (i === 0 ? ' active' : '');
    div.id = 'section-' + i;
    div.innerHTML =
      '<div class="section-header">' +
        '<div class="section-num">' + t.num + '</div>' +
        '<div>' +
          '<div class="section-title">' + t.title + '</div>' +
          '<span class="section-level" style="background:' + levelBg[t.badge] + ';color:' + levelColors[t.badge] + '">' + t.level + '</span>' +
        '</div>' +
      '</div>' + t.html;
    container.appendChild(div);
  });
}

// ── UPDATE PROGRESS ───────────────────────────────────────────────────────────
function updateProgress() {
  const total = TOPICS[activeCourse.id].length;
  const pct = ((cur + 1) / total * 100).toFixed(1);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = (cur + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === total - 1;
}

// ── GO TO TOPIC ───────────────────────────────────────────────────────────────
function go(i) {
  var active = document.querySelector('.section.active');
  if (active) active.classList.remove('active');
  document.querySelectorAll('.nav-item.active').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn.active').forEach(function(el){ el.classList.remove('active'); });
  cur = i;
  var sec = document.getElementById('section-' + i);
  if (sec) sec.classList.add('active');
  var navItems = document.querySelectorAll('.nav-item');
  var tabBtns  = document.querySelectorAll('.tab-btn');
  // Find correct nav item (grouped nav, so we match by data)
  var topics = TOPICS[activeCourse.id];
  var counter = 0;
  navItems.forEach(function(el) {
    if (el.textContent.indexOf(topics[i].num) > -1 && el.textContent.indexOf(topics[i].title.substring(0,8)) > -1) {
      el.classList.add('active');
    }
  });
  if (tabBtns[i]) tabBtns[i].classList.add('active');
  updateProgress();
  window.scrollTo({top: 0, behavior: 'smooth'});
  if (tabBtns[i]) tabBtns[i].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}

function navigate(d) {
  go(Math.max(0, Math.min(TOPICS[activeCourse.id].length - 1, cur + d)));
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown', function(e) {
  if (!activeCourse) return;
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'Escape') goHome();
});

<div class="card"><div class="card-title">Azure Active Directory (Azure AD / Entra ID)</div><ul class="note-list">

<li><strong>Tenants:</strong> Organization ka dedicated Azure AD instance</li>
<li><strong>Users, Groups, Service Principals, Managed Identities</strong></li>
<li><strong>SSO:</strong> Single Sign-On — ek baar login, sab Microsoft services access</li>
