<div class="card"><div class="card-title">RBAC (Role-Based Access Control)</div><ul class="note-list">
<li>Kaun kya kar sakta hai — <strong>Who (Principal) + What (Role) + Where (Scope)</strong></li>
<li><strong>Built-in Roles:</strong> Owner, Contributor, Reader, User Access Administrator</li>
<li><strong>Custom Roles:</strong> Fine-grained permissions define karo</li>
<li><strong>Scope:</strong> Management Group → Subscription → Resource Group → Resource</li>
<li><strong>Managed Identity:</strong> App ko automatically Azure AD identity dedo — no credentials needed</li>
</ul>
<div class="tip-box"><p><strong>Best Practice:</strong> Least privilege principle — sirf zaroori permissions do. Service ke liye Managed Identity use karo, credentials mat store karo.</p></div>
</div>
<div class="card"><div class="card-title">Azure Key Vault & Security Services</div>
<div class="arch-row"><div class="arch-label">Key Vault</div><div class="arch-val">Secrets, keys, certificates securely store karo. App se directly retrieve karo, code mein hardcode mat karo.</div></div>
<div class="arch-row"><div class="arch-label">Microsoft Defender</div><div class="arch-val">Cloud workload protection — VMs, databases, containers ke threats detect karo.</div></div>
<div class="arch-row"><div class="arch-label">Azure Sentinel</div><div class="arch-val">Cloud-native SIEM — security events collect, analyze, respond karo.</div></div>
<div class="arch-row"><div class="arch-label">Azure Policy</div><div class="arch-val">Governance rules enforce karo — compliant resources only deploy ho sakein.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Managed Identity kya hoti hai? Service Principal se kaise better hai?</li>
<li>RBAC scope hierarchy explain karo — inheritance kaise kaam karta hai?</li>
<li>Azure Key Vault ko application ke saath kaise integrate karte hain?</li>
<li>Conditional Access policies kab zaroori hoti hain?</li>
<li>Azure AD B2B vs B2C — kab kya use karoge?</li>
</ol></div>`},
  {num:`07`,title:`Azure Messaging & Integration`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Azure Service Bus</div><ul class="note-list">
<li>Enterprise messaging — reliable, ordered, transactional messaging</li>
<li><strong>Queues:</strong> Point-to-point — ek sender, ek receiver</li>
<li><strong>Topics + Subscriptions:</strong> Pub/Sub — ek message, multiple subscribers filter-based</li>
<li><strong>Sessions:</strong> Ordered processing — FIFO guarantee</li>
<li><strong>Dead Letter Queue (DLQ):</strong> Failed messages automatically yahan jaate hain</li>
<li>Max message size: 256KB (Standard) | 100MB (Premium)</li>
</ul></div>
<div class="card"><div class="card-title">Azure Event Hub</div><ul class="note-list">
<li>Big data streaming platform — Kafka jaisa, millions events/second</li>
<li><strong>Partitions:</strong> Parallel processing ke liye — throughput badhaao</li>
<li><strong>Consumer Groups:</strong> Multiple readers independently same stream padh sakein</li>
<li><strong>Capture:</strong> Events automatically Blob Storage ya Data Lake mein save karo</li>
<li><strong>Kafka compatible:</strong> Existing Kafka apps bina code change ke connect kar sakte hain</li>
</ul></div>
<div class="card"><div class="card-title">Azure Event Grid & Logic Apps</div>
<div class="arch-row"><div class="arch-label">Event Grid</div><div class="arch-val">Reactive event routing — Blob uploaded, VM deleted → trigger Functions/Logic Apps. Push model.</div></div>
<div class="arch-row"><div class="arch-label">Logic Apps</div><div class="arch-val">Low-code workflow automation — 400+ connectors. Salesforce, SAP, Office 365 integrate karo.</div></div>
<div class="arch-row"><div class="arch-label">API Management</div><div class="arch-val">API gateway — rate limiting, auth, caching, versioning, developer portal.</div></div>
<div class="tip-box"><p><strong>Choose karo:</strong> Service Bus = reliable enterprise messaging | Event Hub = high-volume streaming | Event Grid = reactive event routing</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Service Bus vs Event Hub vs Event Grid — kab kya use karoge?</li>
<li>Service Bus Topics aur Subscriptions kaise kaam karte hain?</li>
<li>Event Hub ka partition strategy kya honi chahiye?</li>
<li>Azure API Management ke key features kya hain?</li>
<li>Logic Apps vs Azure Functions — kab kya prefer karoge?</li>
</ol></div>`},
  {num:`08`,title:`Azure DevOps & Monitoring`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Azure DevOps</div><ul class="note-list">
<li>End-to-end DevOps platform — plan, develop, deliver, operate</li>
<li><strong>Azure Boards:</strong> Work items, sprints, backlogs — Jira jaisa</li>
<li><strong>Azure Repos:</strong> Git repositories hosting — unlimited private repos</li>
<li><strong>Azure Pipelines:</strong> CI/CD — any language, any platform, any cloud</li>
<li><strong>Azure Artifacts:</strong> Package management — npm, NuGet, Maven, PyPI</li>
<li><strong>Azure Test Plans:</strong> Manual + automated testing management</li>
</ul></div>
<div class="card"><div class="card-title">Azure Pipelines — CI/CD</div>
<div class="cmd-block">
<div><span class="cmt"># azure-pipelines.yml</span></div>
<div><span class="str">trigger</span>:</div>
<div>  <span class="fl">branches</span>: {<span class="str">include</span>: [main]}</div>
<div><span class="str">pool</span>:</div>
<div>  <span class="fl">vmImage</span>: <span class="str">ubuntu-latest</span></div>
<div><span class="str">stages</span>:</div>
<div>- <span class="str">stage</span>: Build</div>
<div>  <span class="str">jobs</span>:</div>
<div>  - <span class="str">job</span>: BuildJob</div>
<div>    <span class="str">steps</span>:</div>
<div>    - <span class="str">task</span>: NodeTool@0</div>
<div>      <span class="str">inputs</span>: {<span class="fl">versionSpec</span>: <span class="str">"20.x"</span>}</div>
<div>    - <span class="cmd">script</span>: npm ci && npm test</div>
</div></div>
<div class="card"><div class="card-title">Azure Monitor & Observability</div>
<div class="arch-row"><div class="arch-label">Azure Monitor</div><div class="arch-val">Metrics aur logs collect karo from all Azure resources. Centralized hub.</div></div>
<div class="arch-row"><div class="arch-label">Application Insights</div><div class="arch-val">APM tool — request traces, exceptions, performance, user behavior track karo.</div></div>
<div class="arch-row"><div class="arch-label">Log Analytics</div><div class="arch-val">KQL (Kusto Query Language) se logs query karo. Powerful analysis.</div></div>
<div class="arch-row"><div class="arch-label">Azure Alerts</div><div class="arch-val">Metric ya log condition pe automatically notify karo — email, SMS, webhook.</div></div>
<div class="arch-row"><div class="arch-label">Azure Dashboards</div><div class="arch-val">Custom monitoring dashboards — pin any metric or log query.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Azure Pipelines mein stages, jobs, steps ka hierarchy explain karo.</li>
<li>Application Insights kya track karta hai? SDK kaise integrate karte hain?</li>
<li>Log Analytics mein KQL query kaise likhte hain? Basic example do.</li>
<li>Azure Monitor alerts kaise configure karoge for VM high CPU?</li>
<li>GitHub Actions vs Azure Pipelines — kab kya prefer karoge?</li>
</ol></div>`},
  {num:`09`,title:`Azure AI & Cognitive Services`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Azure AI Services (Cognitive Services)</div><ul class="note-list">
<li>Pre-built AI models — bina ML knowledge ke AI features add karo</li>
<li><strong>Vision:</strong> Computer Vision, Face API, Form Recognizer, Custom Vision</li>
<li><strong>Speech:</strong> Speech-to-Text, Text-to-Speech, Speech Translation</li>
<li><strong>Language:</strong> Text Analytics, Translator, QnA Maker, LUIS</li>
<li><strong>Decision:</strong> Anomaly Detector, Content Moderator, Personalizer</li>
</ul></div>
<div class="card"><div class="card-title">Azure OpenAI Service</div><ul class="note-list">
<li>GPT-4, GPT-3.5, DALL-E, Embeddings — Azure pe managed OpenAI models</li>
<li><strong>Enterprise grade:</strong> Data privacy, compliance, no training on your data</li>
<li><strong>Deployments:</strong> Model versions deploy karo, capacity manage karo</li>
<li>REST API ya SDKs — Python, .NET, JavaScript</li>
<li>Azure Virtual Network ke andar run karo — fully private</li>
</ul></div>
<div class="card"><div class="card-title">Azure Machine Learning</div>
<div class="arch-row"><div class="arch-label">Azure ML Studio</div><div class="arch-val">End-to-end ML platform — data prep, training, deployment, monitoring.</div></div>
<div class="arch-row"><div class="arch-label">Compute Clusters</div><div class="arch-val">Auto-scaling GPU/CPU clusters for training. Pay only when running.</div></div>
<div class="arch-row"><div class="arch-label">MLflow Integration</div><div class="arch-val">Experiment tracking, model registry, deployment pipeline.</div></div>
<div class="arch-row"><div class="arch-label">Managed Endpoints</div><div class="arch-val">Real-time ya batch inference endpoints. Kubernetes ya managed compute.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Azure Cognitive Services vs Azure ML — kab kya use karoge?</li>
<li>Azure OpenAI ko apne private data ke saath kaise use karoge? RAG pattern explain karo.</li>
<li>Azure ML mein model training se deployment tak ka flow kya hoga?</li>
<li>Cognitive Services ki pricing model kya hai? Cost optimize kaise karoge?</li>
<li>Responsible AI Azure mein kaise implement karte hain?</li>
</ol></div>`},
  {num:`10`,title:`Azure Cost & Governance`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Azure Cost Management</div><ul class="note-list">
<li><strong>Azure Cost Management + Billing:</strong> Spending track karo, budgets set karo, alerts lagao</li>
<li><strong>Azure Pricing Calculator:</strong> Estimate karo deploy karne se pehle</li>
<li><strong>TCO Calculator:</strong> On-premise vs Azure cost comparison</li>
<li><strong>Cost Saving Tips:</strong></li>
<li>Reserved Instances (1-3 yr) = 72% savings</li>
<li>Spot VMs = 90% savings (interruptible workloads)</li>
<li>Auto-shutdown dev VMs — nights aur weekends pe</li>
<li>Right-sizing — unused resources identify karo with Azure Advisor</li>
<li>Lifecycle policies — old data cool/archive tier mein move karo</li>
</ul></div>
<div class="card"><div class="card-title">Azure Governance</div>
<div class="arch-row"><div class="arch-label">Management Groups</div><div class="arch-val">Subscriptions ko organize karo — policies aur RBAC hierarchy mein apply karo.</div></div>
<div class="arch-row"><div class="arch-label">Azure Policy</div><div class="arch-val">Rules enforce karo — "sirf approved regions mein deploy ho", "tags mandatory hain".</div></div>
<div class="arch-row"><div class="arch-label">Azure Blueprints</div><div class="arch-val">Environment templates — policies, RBAC, resource groups ek saath deploy karo.</div></div>
<div class="arch-row"><div class="arch-label">Azure Advisor</div><div class="arch-val">Personalized recommendations — cost, security, reliability, performance, operations.</div></div>
<div class="arch-row"><div class="arch-label">Resource Tags</div><div class="arch-val">Metadata labels — cost center, environment, owner. Billing aur management ke liye.</div></div>
</div>
<div class="card"><div class="card-title">Azure Well-Architected Framework</div><ul class="note-list">
<li><strong>Reliability:</strong> Failures se recover karo — HA, DR, backup</li>
<li><strong>Security:</strong> Defense in depth — identity, network, data protection</li>
<li><strong>Cost Optimization:</strong> Value maximize karo, waste minimize karo</li>
<li><strong>Operational Excellence:</strong> DevOps practices, monitoring, automation</li>
<li><strong>Performance Efficiency:</strong> Right resources, scaling, optimization</li>
</ul>
<div class="tip-box"><p><strong>Azure Certifications Path:</strong> AZ-900 (Fundamentals) → AZ-104 (Administrator) → AZ-204 (Developer) → AZ-305 (Solutions Architect)</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Azure cost optimize karne ke top 5 strategies kya hain?</li>
<li>Azure Policy aur Azure Blueprints mein kya fark hai?</li>
<li>Resource tagging strategy kaise design karoge enterprise ke liye?</li>
<li>Azure Well-Architected Framework ke 5 pillars explain karo.</li>
<li>Multi-subscription architecture kab zaroori hoti hai?</li>
</ol></div>`},
  {num:`11`,title:`Azure Architecture Patterns`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">High Availability Architecture</div><ul class="note-list">
<li><strong>99.99% SLA</strong> ke liye: Availability Zones + Load Balancer + Auto-scaling</li>
<li><strong>Active-Active:</strong> Dono regions traffic serve karein — Traffic Manager se distribute</li>
<li><strong>Active-Passive:</strong> Primary region + Standby secondary — failover manual ya automatic</li>
<li><strong>RTO (Recovery Time Objective):</strong> Kitni der mein recover hona chahiye</li>
<li><strong>RPO (Recovery Point Objective):</strong> Kitna data loss acceptable hai</li>
</ul></div>
<div class="card"><div class="card-title">Common Azure Architectures</div>
<div class="arch-row"><div class="arch-label">Web App</div><div class="arch-val">Front Door → App Service → Azure SQL + Redis Cache + Blob Storage</div></div>
<div class="arch-row"><div class="arch-label">Microservices</div><div class="arch-val">API Management → AKS → Service Bus → Cosmos DB + SQL</div></div>
<div class="arch-row"><div class="arch-label">Serverless</div><div class="arch-val">Event Grid → Functions → Cosmos DB + Blob Storage + SendGrid</div></div>
<div class="arch-row"><div class="arch-label">Data Pipeline</div><div class="arch-val">Event Hub → Stream Analytics → Data Lake → Synapse Analytics → Power BI</div></div>
<div class="arch-row"><div class="arch-label">Hybrid</div><div class="arch-val">ExpressRoute/VPN → Azure Arc → on-premise + Azure seamlessly</div></div>
</div>
<div class="card"><div class="card-title">Azure Landing Zone</div><ul class="note-list">
<li>Enterprise-scale Azure setup — management groups, subscriptions, networking, security pre-configured</li>
<li><strong>Platform subscriptions:</strong> Identity, Management, Connectivity</li>
<li><strong>Application subscriptions:</strong> Production, Non-production workloads</li>
<li>Infrastructure as Code — Bicep ya Terraform se automate karo</li>
</ul></div>
<div class="card"><div class="card-title">Infrastructure as Code</div>
<div class="cmd-block">
<div><span class="cmt"># Azure Bicep — ARM template ka modern alternative</span></div>
<div><span class="str">resource</span> storageAccount <span class="str">"Microsoft.Storage/storageAccounts@2023-01-01"</span> = {</div>
<div>  <span class="fl">name</span>: <span class="str">"mystorageaccount"</span></div>
<div>  <span class="fl">location</span>: resourceGroup().location</div>
<div>  <span class="fl">sku</span>: { <span class="fl">name</span>: <span class="str">"Standard_LRS"</span> }</div>
<div>  <span class="fl">kind</span>: <span class="str">"StorageV2"</span></div>
<div>}</div>
<div>&nbsp;</div>
<div><span class="cmt"># Azure CLI</span></div>
<div><span class="cmd">az group create</span> <span class="fl">--name</span> myRG <span class="fl">--location</span> <span class="str">"centralindia"</span></div>
<div><span class="cmd">az deployment group create</span> <span class="fl">--resource-group</span> myRG <span class="fl">--template-file</span> main.bicep</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Multi-region HA architecture Azure pe design karo.</li>
<li>RTO aur RPO ke hisaab se DR strategy kaise choose karoge?</li>
<li>ARM templates vs Bicep vs Terraform — kab kya use karoge?</li>
<li>Azure Landing Zone kya hota hai? Enterprise ke liye kyun zaroori hai?</li>
<li>Microservices architecture Azure pe design karo — services choose karo aur justify karo.</li>
</ol></div>`},
  {num:`12`,title:`Azure Interview Prep`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Most Asked Azure Interview Topics</div><ul class="note-list">
<li><strong>Compute:</strong> VMs, App Service, Functions, AKS — differences aur use cases</li>
<li><strong>Storage:</strong> Blob tiers, replication options, SAS tokens</li>
<li><strong>Networking:</strong> VNet, NSG, Load Balancer vs Application Gateway</li>
<li><strong>Identity:</strong> Azure AD, RBAC, Managed Identity, Key Vault</li>

<li><strong>Messaging:</strong> Service Bus vs Event Hub vs Event Grid</li>
<li><strong>DevOps:</strong> Azure Pipelines, Application Insights</li>
</ul></div>
<div class="card"><div class="card-title">AWS → Azure Service Mapping</div>
<div class="arch-row"><div class="arch-label">EC2</div><div class="arch-val">Azure Virtual Machines</div></div>
<div class="arch-row"><div class="arch-label">S3</div><div class="arch-val">Azure Blob Storage</div></div>
<div class="arch-row"><div class="arch-label">RDS</div><div class="arch-val">Azure SQL Database / Azure Database for PostgreSQL</div></div>
<div class="arch-row"><div class="arch-label">DynamoDB</div><div class="arch-val">Azure Cosmos DB</div></div>
<div class="arch-row"><div class="arch-label">Lambda</div><div class="arch-val">Azure Functions</div></div>
<div class="arch-row"><div class="arch-label">EKS</div><div class="arch-val">Azure Kubernetes Service (AKS)</div></div>
<div class="arch-row"><div class="arch-label">CloudWatch</div><div class="arch-val">Azure Monitor + Application Insights</div></div>
<div class="arch-row"><div class="arch-label">IAM</div><div class="arch-val">Azure Active Directory + RBAC</div></div>
<div class="arch-row"><div class="arch-label">SQS/SNS</div><div class="arch-val">Azure Service Bus</div></div>
<div class="arch-row"><div class="arch-label">Kinesis</div><div class="arch-val">Azure Event Hub</div></div>
</div>
<div class="card"><div class="card-title">Certifications & Resources</div>
<div class="chips">
<span class="chip">📘 AZ-900 — Azure Fundamentals (Beginner)</span>
<span class="chip">📗 AZ-104 — Azure Administrator</span>
<span class="chip">📙 AZ-204 — Azure Developer</span>
<span class="chip">📕 AZ-305 — Solutions Architect Expert</span>
<span class="chip">🌐 Microsoft Learn (free)</span>
<span class="chip">🎥 John Savill YouTube</span>
<span class="chip">📖 Azure Architecture Center</span>
<span class="chip">🧪 Azure Free Account ($200 credit)</span>
</div></div>
<div class="q-section"><div class="q-title">Final Interview Questions</div><ol class="q-list">
<li>Azure pe 3-tier web application architecture design karo.</li>
<li>On-premise SQL Server ko Azure mein migrate karne ka plan kya hoga?</li>
<li>Azure pe zero-downtime deployment strategy kya hogi?</li>
<li>Cost suddenly 3x badh gayi Azure billing mein — kaise investigate karoge?</li>
<li>Azure security posture improve karne ke top 5 steps kya hain?</li>
<li>Startup ke liye Azure architecture suggest karo — cost-effective aur scalable.</li>
</ol></div>`}
];

TOPICS["langchain"] = [
  {num:`01`,title:`LangChain Kya Hai? — Basics`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">LangChain kya hai?</div><ul class="note-list">
<li><strong>Open-source framework</strong> — LLMs ke upar powerful applications banao</li>
<li>Harrison Chase ne 2022 mein banaya — Python aur JavaScript dono mein available</li>
<li><strong>Core idea:</strong> LLMs ko tools, memory, aur data sources ke saath chain karo</li>
<li>GPT-4, Claude, Gemini, Llama — koi bhi LLM plug karo, code same rahega</li>
<li><strong>Use cases:</strong> Chatbots, RAG systems, AI agents, document Q&A, code generation</li>
</ul></div>
<div class="card"><div class="card-title">LangChain Core Components</div>
<div class="arch-row"><div class="arch-label">Models</div><div class="arch-val">LLMs aur Chat Models — OpenAI, Anthropic, Google, Ollama (local) ke saath kaam karo</div></div>
<div class="arch-row"><div class="arch-label">Prompts</div><div class="arch-val">PromptTemplates — dynamic, reusable prompts banao variables ke saath</div></div>
<div class="arch-row"><div class="arch-label">Chains</div><div class="arch-val">Multiple steps ko sequence mein jorado — prompt → LLM → output parser</div></div>
<div class="arch-row"><div class="arch-label">Memory</div><div class="arch-val">Conversation history store karo — chatbot ko context yaad rahe</div></div>
<div class="arch-row"><div class="arch-label">Agents</div><div class="arch-val">LLM ko tools dedo — search, calculator, APIs — khud decide kare kya use karna hai</div></div>
<div class="arch-row"><div class="arch-label">Retrievers</div><div class="arch-val">Vector stores se relevant documents dhundho — RAG ka core</div></div>
</div>
<div class="card"><div class="card-title">Installation & Setup</div>
<div class="cmd-block">
<div><span class="cmt"># Install karo</span></div>
<div><span class="cmd">pip install</span> langchain langchain-openai langchain-community</div>
<div><span class="cmd">pip install</span> python-dotenv chromadb</div>
<div>&nbsp;</div>
<div><span class="cmt"># .env file</span></div>
<div><span class="str">OPENAI_API_KEY</span>=sk-...</div>
<div><span class="str">ANTHROPIC_API_KEY</span>=sk-ant-...</div>
<div>&nbsp;</div>
<div><span class="cmt"># Basic usage</span></div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> ChatOpenAI</div>
<div>llm = ChatOpenAI(model=<span class="str">"gpt-4o"</span>, temperature=<span class="fl">0</span>)</div>
<div>response = llm.invoke(<span class="str">"Python kya hai?"</span>)</div>
<div><span class="cmd">print</span>(response.content)</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>LangChain kya solve karta hai? Bina LangChain ke LLM apps mein kya problems hain?</li>
<li>LangChain ke core components kya hain? Ek real app mein kaise use hote hain?</li>
<li>LangChain vs LlamaIndex — kab kya choose karoge?</li>
<li>LangChain Expression Language (LCEL) kya hai? Purane chains se better kyun?</li>
<li>Different LLM providers ko LangChain mein switch karna kitna easy hai?</li>
</ol></div>`},
  {num:`02`,title:`Models & Prompts`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">LLM vs Chat Models</div>
<div class="arch-row"><div class="arch-label">LLM</div><div class="arch-val">String in → String out. Purana style. <code>llm.invoke("text")</code></div></div>
<div class="arch-row"><div class="arch-label">Chat Model</div><div class="arch-val">Messages in → Message out. Modern. System + Human + AI messages.</div></div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> ChatOpenAI</div>
<div><span class="cmd">from</span> langchain_anthropic <span class="cmd">import</span> ChatAnthropic</div>
<div><span class="cmd">from</span> langchain_community.llms <span class="cmd">import</span> Ollama</div>
<div>&nbsp;</div>
<div><span class="cmt"># Same interface, different providers</span></div>
<div>openai_llm = ChatOpenAI(model=<span class="str">"gpt-4o"</span>)</div>
<div>claude_llm = ChatAnthropic(model=<span class="str">"claude-3-5-sonnet-20241022"</span>)</div>
<div>local_llm  = Ollama(model=<span class="str">"llama3.2"</span>)  <span class="out"># local model</span></div>
</div></div>
<div class="card"><div class="card-title">Prompt Templates</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_core.prompts <span class="cmd">import</span> ChatPromptTemplate, PromptTemplate</div>
<div>&nbsp;</div>
<div><span class="cmt"># Simple template</span></div>
<div>prompt = PromptTemplate.from_template(</div>
<div>    <span class="str">"Mujhe {topic} ke baare mein {language} mein batao"</span></div>
<div>)</div>
<div>&nbsp;</div>
<div><span class="cmt"># Chat template — system + human messages</span></div>
<div>chat_prompt = ChatPromptTemplate.from_messages([</div>
<div>    (<span class="str">"system"</span>, <span class="str">"Tum ek expert {role} ho. Hindi mein jawab do."</span>),</div>
<div>    (<span class="str">"human"</span>, <span class="str">"{question}"</span>)</div>
<div>])</div>
<div>&nbsp;</div>
<div><span class="cmt"># Use karo</span></div>
<div>formatted = chat_prompt.format_messages(role=<span class="str">"developer"</span>, question=<span class="str">"API kya hai?"</span>)</div>
</div></div>
<div class="card"><div class="card-title">Output Parsers</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_core.output_parsers <span class="cmd">import</span> StrOutputParser, JsonOutputParser</div>
<div><span class="cmd">from</span> langchain_core.pydantic_v1 <span class="cmd">import</span> BaseModel</div>
<div>&nbsp;</div>
<div><span class="cmt"># String parser — simple text output</span></div>
<div>parser = StrOutputParser()</div>
<div>&nbsp;</div>
<div><span class="cmt"># Structured output with Pydantic</span></div>
<div><span class="cmd">class</span> <span class="fl">PersonInfo</span>(BaseModel):</div>
<div>    name: str</div>
<div>    age: int</div>
<div>    skills: list[str]</div>
<div>&nbsp;</div>
<div>structured_llm = llm.with_structured_output(PersonInfo)</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>ChatPromptTemplate mein system message kyun important hai?</li>
<li>Temperature parameter kya karta hai? Kab 0 use karein, kab higher?</li>
<li>Structured output kaise force karte hain LLM se? Pydantic ka role?</li>
<li>Few-shot prompting kya hai? LangChain mein kaise implement karte hain?</li>
<li>Prompt injection attacks kya hote hain? Kaise prevent karoge?</li>
</ol></div>`},
  {num:`03`,title:`LCEL — LangChain Expression Language`,level:`Fundamentals`,badge:`fund`,html:`
<div class="card"><div class="card-title">LCEL Kya Hai?</div><ul class="note-list">
<li>LangChain ka modern way — <strong>pipe operator (|)</strong> se components chain karo</li>
<li>Declarative, composable, streaming support built-in</li>
<li>Async, batch, streaming — sab automatically support hota hai</li>
<li>LangSmith tracing automatically kaam karta hai LCEL chains ke saath</li>
</ul></div>
<div class="card"><div class="card-title">Basic LCEL Chains</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_core.prompts <span class="cmd">import</span> ChatPromptTemplate</div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> ChatOpenAI</div>
<div><span class="cmd">from</span> langchain_core.output_parsers <span class="cmd">import</span> StrOutputParser</div>
<div>&nbsp;</div>
<div><span class="cmt"># Pipe se chain banao — prompt | llm | parser</span></div>
<div>prompt = ChatPromptTemplate.from_template(<span class="str">"{topic} explain karo"</span>)</div>
<div>llm    = ChatOpenAI(model=<span class="str">"gpt-4o-mini"</span>)</div>
<div>parser = StrOutputParser()</div>
<div>&nbsp;</div>
<div>chain = prompt | llm | parser</div>
<div>&nbsp;</div>
<div><span class="cmt"># Invoke karo</span></div>
<div>result = chain.invoke({<span class="str">"topic"</span>: <span class="str">"RAG"</span>})</div>
<div>&nbsp;</div>
<div><span class="cmt"># Stream karo</span></div>
<div><span class="cmd">for</span> chunk <span class="cmd">in</span> chain.stream({<span class="str">"topic"</span>: <span class="str">"RAG"</span>}):</div>
<div>    <span class="cmd">print</span>(chunk, end=<span class="str">""</span>, flush=<span class="fl">True</span>)</div>
<div>&nbsp;</div>
<div><span class="cmt"># Batch karo — multiple inputs ek saath</span></div>
<div>results = chain.batch([{<span class="str">"topic"</span>: <span class="str">"RAG"</span>}, {<span class="str">"topic"</span>: <span class="str">"Agents"</span>}])</div>
</div></div>
<div class="card"><div class="card-title">Advanced LCEL — RunnableParallel & RunnableLambda</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_core.runnables <span class="cmd">import</span> RunnableParallel, RunnableLambda, RunnablePassthrough</div>
<div>&nbsp;</div>
<div><span class="cmt"># Parallel mein multiple chains ek saath chalao</span></div>
<div>parallel_chain = RunnableParallel({</div>
<div>    <span class="str">"summary"</span>  : summary_chain,</div>
<div>    <span class="str">"keywords"</span> : keyword_chain,</div>
<div>    <span class="str">"sentiment"</span>: sentiment_chain</div>
<div>})</div>
<div>&nbsp;</div>
<div><span class="cmt"># Input passthrough — original input aage bhi bhejo</span></div>
<div>chain = RunnableParallel({</div>
<div>    <span class="str">"question"</span>: RunnablePassthrough(),</div>
<div>    <span class="str">"context"</span> : retriever</div>
<div>}) | prompt | llm | parser</div>
<div>&nbsp;</div>
<div><span class="cmt"># Custom function chain mein add karo</span></div>
<div>def add_context(x): <span class="cmd">return</span> x[<span class="str">"question"</span>].upper()</div>
<div>chain = RunnableLambda(add_context) | llm</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>LCEL kya hai? Purane LLMChain se kaise alag hai?</li>
<li>RunnableParallel kab use karte hain? Performance benefit kya hai?</li>
<li>RunnablePassthrough ka use case kya hai RAG mein?</li>
<li>LCEL chain mein error handling kaise karte hain?</li>
<li>Streaming response kaise implement karte hain LCEL se?</li>
</ol></div>`},
  {num:`04`,title:`RAG — Retrieval Augmented Generation`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">RAG kya hai aur kyun?</div><ul class="note-list">
<li><strong>Problem:</strong> LLM ka knowledge cutoff hota hai — latest/private data nahi jaanta</li>
<li><strong>Solution:</strong> User query se relevant documents dhundho → LLM ko context dedo</li>
<li><strong>RAG Pipeline:</strong> Document load → Split → Embed → Store → Retrieve → Generate</li>
<li>Fine-tuning se better — real-time data, cheaper, explainable, updatable</li>
</ul></div>
<div class="card"><div class="card-title">RAG Pipeline — Step by Step</div>
<div class="flow">
<div class="flow-box red">Documents</div>
<div class="flow-arrow">→</div>
<div class="flow-box" style="border-color:rgba(247,185,85,0.4);color:#f7b955;background:rgba(247,185,85,0.08)">Split</div>
<div class="flow-arrow">→</div>
<div class="flow-box" style="border-color:rgba(124,106,247,0.4);color:#a998ff;background:rgba(124,106,247,0.08)">Embed</div>
<div class="flow-arrow">→</div>
<div class="flow-box green">Vector DB</div>
</div>
<div class="flow" style="margin-top:8px">
<div class="flow-box" style="border-color:rgba(247,185,85,0.4);color:#f7b955;background:rgba(247,185,85,0.08)">Query</div>
<div class="flow-arrow">→</div>
<div class="flow-box" style="border-color:rgba(124,106,247,0.4);color:#a998ff;background:rgba(124,106,247,0.08)">Retrieve</div>
<div class="flow-arrow">→</div>
<div class="flow-box green">LLM + Context</div>
<div class="flow-arrow">→</div>
<div class="flow-box red">Answer</div>
</div></div>
<div class="card"><div class="card-title">RAG Implementation</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_community.document_loaders <span class="cmd">import</span> PyPDFLoader, WebBaseLoader</div>
<div><span class="cmd">from</span> langchain.text_splitter <span class="cmd">import</span> RecursiveCharacterTextSplitter</div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> OpenAIEmbeddings, ChatOpenAI</div>
<div><span class="cmd">from</span> langchain_community.vectorstores <span class="cmd">import</span> Chroma</div>
<div><span class="cmd">from</span> langchain_core.prompts <span class="cmd">import</span> ChatPromptTemplate</div>
<div><span class="cmd">from</span> langchain_core.runnables <span class="cmd">import</span> RunnablePassthrough</div>
<div><span class="cmd">from</span> langchain_core.output_parsers <span class="cmd">import</span> StrOutputParser</div>
<div>&nbsp;</div>
<div><span class="cmt"># 1. Load documents</span></div>
<div>loader = PyPDFLoader(<span class="str">"document.pdf"</span>)</div>
<div>docs = loader.load()</div>
<div>&nbsp;</div>
<div><span class="cmt"># 2. Split into chunks</span></div>
<div>splitter = RecursiveCharacterTextSplitter(chunk_size=<span class="fl">1000</span>, chunk_overlap=<span class="fl">200</span>)</div>
<div>chunks = splitter.split_documents(docs)</div>
<div>&nbsp;</div>
<div><span class="cmt"># 3. Embed aur store</span></div>
<div>embeddings = OpenAIEmbeddings(model=<span class="str">"text-embedding-3-small"</span>)</div>
<div>vectorstore = Chroma.from_documents(chunks, embeddings)</div>
<div>retriever = vectorstore.as_retriever(search_kwargs={<span class="str">"k"</span>: <span class="fl">4</span>})</div>
<div>&nbsp;</div>
<div><span class="cmt"># 4. RAG chain</span></div>
<div>prompt = ChatPromptTemplate.from_template(<span class="str">"""</span></div>
<div><span class="str">Sirf is context ke basis pe jawab do:</span></div>
<div><span class="str">Context: {context}</span></div>
<div><span class="str">Question: {question}"""</span>)</div>
<div>&nbsp;</div>
<div>rag_chain = (</div>
<div>    {<span class="str">"context"</span>: retriever, <span class="str">"question"</span>: RunnablePassthrough()}</div>
<div>    | prompt | ChatOpenAI() | StrOutputParser()</div>
<div>)</div>
<div>answer = rag_chain.invoke(<span class="str">"Document mein kya likha hai?"</span>)</div>
</div></div>
<div class="card"><div class="card-title">Text Splitters</div>
<div class="arch-row"><div class="arch-label">RecursiveCharacter</div><div class="arch-val">Default choice — paragraph → sentence → word order mein split karta hai. Most reliable.</div></div>
<div class="arch-row"><div class="arch-label">CharacterTextSplitter</div><div class="arch-val">Simple character-based split. Fast but naive.</div></div>
<div class="arch-row"><div class="arch-label">MarkdownHeaderSplitter</div><div class="arch-val">Markdown headers ke hisaab se split — structure preserve karo.</div></div>
<div class="arch-row"><div class="arch-label">SemanticChunker</div><div class="arch-val">Embedding similarity se split — semantically coherent chunks. Best quality.</div></div>
<div class="tip-box"><p><strong>Chunk size tuning:</strong> chunk_size=1000, chunk_overlap=200 — good starting point. Overlap ensures context boundary pe information loss na ho.</p></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>RAG kya hai? Fine-tuning se kab better hai?</li>
<li>Chunk size aur overlap kaise choose karoge? Trade-offs kya hain?</li>
<li>RAG accuracy improve karne ke kya techniques hain?</li>
<li>Naive RAG vs Advanced RAG (HyDE, re-ranking, multi-query) — explain karo.</li>
<li>RAG pipeline mein hallucinations kaise reduce karoge?</li>
</ol></div>`},
  {num:`05`,title:`Vector Stores & Embeddings`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Embeddings kya hote hain?</div><ul class="note-list">
<li>Text → numerical vectors — similar meaning = similar vectors</li>
<li><strong>Semantic search:</strong> Exact keyword match nahi — meaning match karo</li>
<li>"Dog" aur "puppy" ke embeddings close honge — keywords alag hain but meaning similar</li>
<li><strong>Dimensions:</strong> OpenAI text-embedding-3-small = 1536 dimensions</li>
<li><strong>Cosine similarity:</strong> Do vectors ka angle measure karo — 1.0 = identical, 0 = unrelated</li>
</ul></div>
<div class="card"><div class="card-title">Embedding Models</div>
<div class="arch-row"><div class="arch-label">OpenAI</div><div class="arch-val">text-embedding-3-small (fast, cheap) | text-embedding-3-large (best quality). Most popular.</div></div>
<div class="arch-row"><div class="arch-label">HuggingFace</div><div class="arch-val">all-MiniLM-L6-v2 — free, local. Good quality. <code>langchain_community.HuggingFaceEmbeddings</code></div></div>
<div class="arch-row"><div class="arch-label">Cohere</div><div class="arch-val">Multilingual embeddings — multiple languages support.</div></div>
<div class="arch-row"><div class="arch-label">Ollama</div><div class="arch-val">Local embeddings — nomic-embed-text. Free, private, no API needed.</div></div>
</div>
<div class="card"><div class="card-title">Vector Stores</div>
<div class="arch-row"><div class="arch-label">Chroma</div><div class="arch-val">Local, open-source, easy setup. Development aur small projects ke liye best.</div></div>
<div class="arch-row"><div class="arch-label">FAISS</div><div class="arch-val">Facebook ka — in-memory, very fast similarity search. Large datasets ke liye.</div></div>
<div class="arch-row"><div class="arch-label">Pinecone</div><div class="arch-val">Managed cloud vector DB — production ke liye, auto-scaling, fully managed.</div></div>
<div class="arch-row"><div class="arch-label">Weaviate</div><div class="arch-val">Open-source, self-hosted ya cloud. Hybrid search (vector + keyword) built-in.</div></div>
<div class="arch-row"><div class="arch-label">Qdrant</div><div class="arch-val">High performance, Rust-based. Filtering + vector search saath mein.</div></div>
<div class="arch-row"><div class="arch-label">pgvector</div><div class="arch-val">PostgreSQL extension — existing DB mein vector search add karo.</div></div>
</div>
<div class="card"><div class="card-title">Retriever Types</div>
<div class="cmd-block">
<div><span class="cmt"># Basic similarity search</span></div>
<div>retriever = vectorstore.as_retriever(search_kwargs={<span class="str">"k"</span>: <span class="fl">4</span>})</div>
<div>&nbsp;</div>
<div><span class="cmt"># MMR — diversity ensure karo (similar chunks avoid)</span></div>
<div>retriever = vectorstore.as_retriever(search_type=<span class="str">"mmr"</span>, search_kwargs={<span class="str">"k"</span>: <span class="fl">4</span>, <span class="str">"fetch_k"</span>: <span class="fl">20</span>})</div>
<div>&nbsp;</div>
<div><span class="cmt"># Score threshold — low quality results filter karo</span></div>
<div>retriever = vectorstore.as_retriever(</div>
<div>    search_type=<span class="str">"similarity_score_threshold"</span>,</div>
<div>    search_kwargs={<span class="str">"score_threshold"</span>: <span class="fl">0.7</span>}</div>
<div>)</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Embeddings kya hote hain? Cosine similarity kaise kaam karti hai?</li>
<li>Vector store choose karne ke criteria kya hain? Production ke liye kya recommend karoge?</li>
<li>MMR retrieval kya hai? Regular similarity search se better kab?</li>
<li>Hybrid search kya hota hai? Kab zaroori hai?</li>
<li>Embedding model change karne pe kya karna padega existing vector store ka?</li>
</ol></div>`},
  {num:`06`,title:`Memory & Conversation`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Conversation Memory kya hai?</div><ul class="note-list">
<li>LLMs stateless hote hain — har call pe pichla conversation bhool jaate hain</li>
<li>Memory = previous messages ko context mein include karna</li>
<li><strong>Challenge:</strong> Context window limit hai — poora history nahi daal sakte</li>
</ul></div>
<div class="card"><div class="card-title">Memory Types</div>
<div class="arch-row"><div class="arch-label">ConversationBufferMemory</div><div class="arch-val">Poora conversation store karo. Simple but context window overflow hoga long conversations mein.</div></div>
<div class="arch-row"><div class="arch-label">ConversationWindowMemory</div><div class="arch-val">Last K messages rakho. <code>k=5</code> means last 5 turns. Memory bounded rahti hai.</div></div>
<div class="arch-row"><div class="arch-label">ConversationSummaryMemory</div><div class="arch-val">Purani conversation ka summary banao LLM se. Long conversations ke liye best.</div></div>
<div class="arch-row"><div class="arch-label">ConversationTokenBuffer</div><div class="arch-val">Token count ke hisaab se trim karo. Context window precisely control karo.</div></div>
<div class="arch-row"><div class="arch-label">VectorStoreMemory</div><div class="arch-val">Conversation vectorize karo — relevant past memories retrieve karo semantically.</div></div>
</div>
<div class="card"><div class="card-title">Modern Approach — LangGraph State</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_core.messages <span class="cmd">import</span> HumanMessage, AIMessage, SystemMessage</div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> ChatOpenAI</div>
<div>&nbsp;</div>
<div><span class="cmt"># Messages list manually manage karo — most control</span></div>
<div>chat_history = []</div>
<div>llm = ChatOpenAI(model=<span class="str">"gpt-4o"</span>)</div>
<div>&nbsp;</div>
<div><span class="cmd">def</span> <span class="fl">chat</span>(user_input):</div>
<div>    chat_history.append(HumanMessage(content=user_input))</div>
<div>    response = llm.invoke(chat_history)</div>
<div>    chat_history.append(AIMessage(content=response.content))</div>
<div>    <span class="cmd">return</span> response.content</div>
<div>&nbsp;</div>
<div><span class="cmt"># Persistent memory — DB mein store karo</span></div>
<div><span class="cmd">from</span> langchain_community.chat_message_histories <span class="cmd">import</span> SQLChatMessageHistory</div>
<div>history = SQLChatMessageHistory(session_id=<span class="str">"user_123"</span>, connection_string=<span class="str">"sqlite:///chat.db"</span>)</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>LLM stateless kyun hota hai? Memory kaise implement karte hain?</li>
<li>Different memory types mein kab kya choose karoge?</li>
<li>Context window overflow hone pe kya strategies use karoge?</li>
<li>Multi-user chatbot mein session isolation kaise karte hain?</li>
<li>Persistent memory — Redis ya Database mein conversation kaise store karoge?</li>
</ol></div>`},
  {num:`07`,title:`Agents & Tools`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">Agents kya hote hain?</div><ul class="note-list">
<li>LLM + Tools = Agent — LLM <strong>khud decide karta hai</strong> kaunsa tool use karna hai</li>
<li><strong>ReAct pattern:</strong> Reason → Act → Observe → Repeat until done</li>
<li>Fixed chain nahi — dynamic, autonomous decision making</li>
<li><strong>Use cases:</strong> Research assistant, coding agent, data analysis, customer support</li>
</ul></div>
<div class="card"><div class="card-title">Tools Define Karna</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain_core.tools <span class="cmd">import</span> tool</div>
<div><span class="cmd">from</span> langchain_community.tools <span class="cmd">import</span> TavilySearchResults, WikipediaQueryRun</div>
<div>&nbsp;</div>
<div><span class="cmt"># Custom tool banana</span></div>
<div>@tool</div>
<div><span class="cmd">def</span> <span class="fl">calculate_age</span>(birth_year: int) -> str:</div>
<div>    <span class="str">"""Calculate karo kisi ki age birth year se."""</span></div>
<div>    age = <span class="fl">2025</span> - birth_year</div>
<div>    <span class="cmd">return</span> <span class="fl">f</span><span class="str">"{age} saal ki age hai"</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># Built-in tools</span></div>
<div>search_tool = TavilySearchResults(max_results=<span class="fl">3</span>)</div>
<div>wiki_tool = WikipediaQueryRun()</div>
<div>&nbsp;</div>
<div>tools = [calculate_age, search_tool, wiki_tool]</div>
</div></div>
<div class="card"><div class="card-title">Agent with Tool Calling</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain.agents <span class="cmd">import</span> create_tool_calling_agent, AgentExecutor</div>
<div><span class="cmd">from</span> langchain_core.prompts <span class="cmd">import</span> ChatPromptTemplate</div>
<div>&nbsp;</div>
<div>prompt = ChatPromptTemplate.from_messages([</div>
<div>    (<span class="str">"system"</span>, <span class="str">"Tum ek helpful assistant ho. Tools use karo zaroori ho toh."</span>),</div>
<div>    (<span class="str">"human"</span>, <span class="str">"{input}"</span>),</div>
<div>    (<span class="str">"placeholder"</span>, <span class="str">"{agent_scratchpad}"</span>)</div>
<div>])</div>
<div>&nbsp;</div>
<div>llm_with_tools = ChatOpenAI(model=<span class="str">"gpt-4o"</span>)</div>
<div>agent = create_tool_calling_agent(llm_with_tools, tools, prompt)</div>
<div>agent_executor = AgentExecutor(agent=agent, tools=tools, verbose=<span class="fl">True</span>)</div>
<div>&nbsp;</div>
<div>result = agent_executor.invoke({<span class="str">"input"</span>: <span class="str">"Elon Musk ki age kya hai?"</span>})</div>
</div></div>
<div class="card"><div class="card-title">Popular Built-in Tools</div>
<div class="chips">
<span class="chip">TavilySearch — web search</span>
<span class="chip">DuckDuckGoSearch</span>
<span class="chip">WikipediaQueryRun</span>
<span class="chip">PythonREPLTool</span>
<span class="chip">ArXivQueryRun</span>
<span class="chip">GooglePlacesTool</span>
<span class="chip">SQLDatabaseToolkit</span>
<span class="chip">FileManagementToolkit</span>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>Agent aur Chain mein kya fundamental difference hai?</li>
<li>ReAct pattern kya hai? Step by step explain karo.</li>
<li>Tool calling vs function calling — kya difference hai?</li>
<li>Agent ko infinite loop se kaise rokoge? Max iterations?</li>
<li>Multi-agent systems kab zaroori hote hain? Coordination kaise karte hain?</li>
</ol></div>`},
  {num:`08`,title:`LangGraph — Stateful Agents`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">LangGraph kya hai?</div><ul class="note-list">
<li>LangChain ka extension — <strong>graph-based stateful workflows</strong> banao</li>
<li>Nodes = functions/LLM calls | Edges = flow between nodes</li>
<li>State persist karta hai across steps — complex multi-step agents ke liye</li>
<li><strong>Cycles support:</strong> Loop karo jab tak condition satisfy na ho — agents ke liye zaroori</li>
<li>AgentExecutor se better — zyada control, debugging easy, human-in-the-loop support</li>
</ul></div>
<div class="card"><div class="card-title">LangGraph Basic Agent</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langgraph.graph <span class="cmd">import</span> StateGraph, END</div>
<div><span class="cmd">from</span> langgraph.prebuilt <span class="cmd">import</span> ToolNode</div>
<div><span class="cmd">from</span> typing <span class="cmd">import</span> TypedDict, Annotated</div>
<div><span class="cmd">from</span> langchain_core.messages <span class="cmd">import</span> BaseMessage</div>
<div><span class="cmd">import</span> operator</div>
<div>&nbsp;</div>
<div><span class="cmt"># State define karo</span></div>
<div><span class="cmd">class</span> <span class="fl">AgentState</span>(TypedDict):</div>
<div>    messages: Annotated[list[BaseMessage], operator.add]</div>
<div>&nbsp;</div>
<div><span class="cmt"># Nodes define karo</span></div>
<div><span class="cmd">def</span> <span class="fl">call_llm</span>(state: AgentState):</div>
<div>    response = llm_with_tools.invoke(state[<span class="str">"messages"</span>])</div>
<div>    <span class="cmd">return</span> {<span class="str">"messages"</span>: [response]}</div>
<div>&nbsp;</div>
<div><span class="cmt"># Graph banao</span></div>
<div>graph = StateGraph(AgentState)</div>
<div>graph.add_node(<span class="str">"llm"</span>, call_llm)</div>
<div>graph.add_node(<span class="str">"tools"</span>, ToolNode(tools))</div>
<div>graph.set_entry_point(<span class="str">"llm"</span>)</div>
<div>&nbsp;</div>
<div><span class="cmt"># Conditional edges — tool call hai toh tools node, nahi toh END</span></div>
<div><span class="cmd">def</span> <span class="fl">should_continue</span>(state): <span class="cmd">return</span> <span class="str">"tools"</span> <span class="cmd">if</span> state[<span class="str">"messages"</span>][-<span class="fl">1</span>].tool_calls <span class="cmd">else</span> END</div>
<div>graph.add_conditional_edges(<span class="str">"llm"</span>, should_continue)</div>
<div>graph.add_edge(<span class="str">"tools"</span>, <span class="str">"llm"</span>)</div>
<div>&nbsp;</div>
<div>app = graph.compile()</div>
<div>result = app.invoke({<span class="str">"messages"</span>: [HumanMessage(content=<span class="str">"Latest news kya hai?"</span>)]})</div>
</div></div>
<div class="card"><div class="card-title">LangGraph Features</div>
<div class="arch-row"><div class="arch-label">Persistence</div><div class="arch-val">Checkpointing — state save karo, resume karo baad mein. SQLite ya Redis backend.</div></div>
<div class="arch-row"><div class="arch-label">Human-in-Loop</div><div class="arch-val">Agent pause karo, human approval lo, phir continue karo — interrupt_before nodes.</div></div>
<div class="arch-row"><div class="arch-label">Streaming</div><div class="arch-val">Har step ka output stream karo — real-time visibility into agent actions.</div></div>
<div class="arch-row"><div class="arch-label">Multi-Agent</div><div class="arch-val">Multiple agents as subgraphs — supervisor pattern, swarm pattern.</div></div>
</div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>LangGraph vs AgentExecutor — kyon LangGraph better hai complex agents ke liye?</li>
<li>StateGraph mein state kaise define karte hain? Reducer kya hota hai?</li>
<li>Human-in-the-loop kaise implement karte hain LangGraph mein?</li>
<li>Checkpointing kya hai? Production mein kaise use karte hain?</li>
<li>Multi-agent graph mein supervisor pattern kaise kaam karta hai?</li>
</ol></div>`},
  {num:`09`,title:`LangSmith — Debugging & Monitoring`,level:`Intermediate`,badge:`inter`,html:`
<div class="card"><div class="card-title">LangSmith kya hai?</div><ul class="note-list">
<li>LangChain ka <strong>observability aur evaluation platform</strong></li>
<li>Every LLM call, chain step, tool use — sab trace hota hai</li>
<li><strong>Debug karo:</strong> Kahan fail hua, kya input gaya, kya output aaya, kitna time laga</li>
<li><strong>Evaluate karo:</strong> RAG accuracy, hallucination rate, response quality measure karo</li>
<li><strong>Dataset + Testing:</strong> Regression test karo model/prompt changes pe</li>
</ul></div>
<div class="card"><div class="card-title">LangSmith Setup</div>
<div class="cmd-block">
<div><span class="cmt"># .env mein add karo</span></div>
<div><span class="str">LANGCHAIN_TRACING_V2</span>=<span class="fl">true</span></div>
<div><span class="str">LANGCHAIN_API_KEY</span>=lsv2_pt_...</div>
<div><span class="str">LANGCHAIN_PROJECT</span>=<span class="str">"my-rag-app"</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># Bas itna karo — automatically sab trace hoga</span></div>
<div><span class="cmt"># Koi code change nahi chahiye!</span></div>
<div>&nbsp;</div>
<div><span class="cmt"># Manual tagging — traces organize karo</span></div>
<div><span class="cmd">from</span> langsmith <span class="cmd">import</span> traceable</div>
<div>&nbsp;</div>
<div>@traceable(name=<span class="str">"my-rag-chain"</span>, tags=[<span class="str">"production"</span>])</div>
<div><span class="cmd">def</span> <span class="fl">run_rag</span>(question: str) -> str:</div>
<div>    <span class="cmd">return</span> rag_chain.invoke(question)</div>
</div></div>
<div class="card"><div class="card-title">Evaluation with LangSmith</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langsmith.evaluation <span class="cmd">import</span> evaluate, LangChainStringEvaluator</div>
<div>&nbsp;</div>
<div><span class="cmt"># Dataset banao</span></div>
<div>dataset = client.create_dataset(<span class="str">"rag-eval-dataset"</span>)</div>
<div>client.create_examples(</div>
<div>    inputs=[{<span class="str">"question"</span>: <span class="str">"Capital of India?"</span>}],</div>
<div>    outputs=[{<span class="str">"answer"</span>: <span class="str">"New Delhi"</span>}],</div>
<div>    dataset_id=dataset.id</div>
<div>)</div>
<div>&nbsp;</div>
<div><span class="cmt"># Evaluate karo</span></div>
<div>results = evaluate(</div>
<div>    rag_chain.invoke,</div>
<div>    data=<span class="str">"rag-eval-dataset"</span>,</div>
<div>    evaluators=[LangChainStringEvaluator(<span class="str">"qa"</span>)]</div>
<div>)</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>LangSmith kyun zaroori hai? Bina iske kya problems hoti hain?</li>
<li>RAG pipeline evaluate kaise karte hain? Metrics kya hone chahiye?</li>
<li>LangSmith mein traces kaise filter aur search karte hain?</li>
<li>Prompt regression testing kya hai? Kaise setup karoge?</li>
<li>Production mein LLM costs monitor kaise karoge LangSmith se?</li>
</ol></div>`},
  {num:`10`,title:`Advanced RAG Techniques`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">Naive RAG ke Problems</div><ul class="note-list">
<li><strong>Poor retrieval:</strong> User query aur document language mein mismatch</li>
<li><strong>Lost in middle:</strong> LLM long context ke middle mein information ignore karta hai</li>
<li><strong>Irrelevant chunks:</strong> Semantically similar but contextually useless documents</li>
<li><strong>Hallucinations:</strong> Retrieved context ke bawajood LLM galat jawab deta hai</li>
</ul></div>
<div class="card"><div class="card-title">Advanced Retrieval Techniques</div>
<div class="arch-row"><div class="arch-label">HyDE</div><div class="arch-val">Hypothetical Document Embeddings — pehle hypothetical answer generate karo, phir usse retrieve karo. Query-doc mismatch solve.</div></div>
<div class="arch-row"><div class="arch-label">Multi-Query</div><div class="arch-val">Ek query se multiple variations generate karo, sab se retrieve karo, combine karo. Better coverage.</div></div>
<div class="arch-row"><div class="arch-label">Re-ranking</div><div class="arch-val">Initial results ko cross-encoder se re-rank karo. Cohere Rerank, BGE Reranker. Precision improve.</div></div>
<div class="arch-row"><div class="arch-label">Hybrid Search</div><div class="arch-val">Vector search + BM25 keyword search combine karo. Dense + sparse retrieval.</div></div>
<div class="arch-row"><div class="arch-label">Parent-Child</div><div class="arch-val">Chhote chunks retrieve karo (precision), bade parent chunks LLM ko do (context).</div></div>
<div class="arch-row"><div class="arch-label">RAPTOR</div><div class="arch-val">Document tree banao summaries se, different levels pe retrieve karo — multi-level RAG.</div></div>
</div>
<div class="card"><div class="card-title">Multi-Query Retriever Code</div>
<div class="cmd-block">
<div><span class="cmd">from</span> langchain.retrievers.multi_query <span class="cmd">import</span> MultiQueryRetriever</div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> ChatOpenAI</div>
<div>&nbsp;</div>
<div>multi_retriever = MultiQueryRetriever.from_llm(</div>
<div>    retriever=vectorstore.as_retriever(),</div>
<div>    llm=ChatOpenAI(temperature=<span class="fl">0</span>)</div>
<div>)</div>
<div><span class="cmt"># LLM automatically 3 query variations generate karega</span></div>
<div>docs = multi_retriever.get_relevant_documents(<span class="str">"RAG kaise kaam karta hai?"</span>)</div>
</div></div>
<div class="card"><div class="card-title">Agentic RAG & CRAG</div><ul class="note-list">
<li><strong>Agentic RAG:</strong> Agent decide kare kab retrieve karna hai, kab nahi</li>
<li><strong>CRAG (Corrective RAG):</strong> Retrieved docs evaluate karo — irrelevant hain toh web search karo</li>
<li><strong>Self-RAG:</strong> LLM khud evaluate kare ki answer grounded hai ya nahi</li>
<li><strong>Adaptive RAG:</strong> Query complexity ke hisaab se retrieval strategy choose karo</li>
</ul></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>HyDE technique kya hai? Kab use karoge?</li>
<li>Re-ranking kya hai? Bi-encoder vs Cross-encoder difference?</li>
<li>Parent-child chunking strategy kaise kaam kati hai?</li>
<li>Hybrid search implement kaise karoge? RRF (Reciprocal Rank Fusion) kya hai?</li>
<li>RAG evaluation metrics — Faithfulness, Answer Relevancy, Context Recall explain karo.</li>
</ol></div>`},
  {num:`11`,title:`Production Deployment`,level:`Advanced`,badge:`adv`,html:`
<div class="card"><div class="card-title">LangServe — API Deployment</div>
<div class="cmd-block">
<div><span class="cmd">pip install</span> langserve[all] fastapi uvicorn</div>
<div>&nbsp;</div>
<div><span class="cmt"># server.py</span></div>
<div><span class="cmd">from</span> fastapi <span class="cmd">import</span> FastAPI</div>
<div><span class="cmd">from</span> langserve <span class="cmd">import</span> add_routes</div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> ChatOpenAI</div>
<div><span class="cmd">from</span> langchain_core.output_parsers <span class="cmd">import</span> StrOutputParser</div>
<div>&nbsp;</div>
<div>app = FastAPI(title=<span class="str">"My LLM API"</span>)</div>
<div>chain = ChatOpenAI() | StrOutputParser()</div>
<div>&nbsp;</div>
<div><span class="cmt"># Chain ko route pe serve karo</span></div>
<div>add_routes(app, chain, path=<span class="str">"/chat"</span>)</div>
<div>&nbsp;</div>
<div><span class="cmt"># Run karo</span></div>
<div><span class="cmd">uvicorn</span> server:app <span class="fl">--host 0.0.0.0 --port 8000</span></div>
<div><span class="cmt"># Automatic: /chat/invoke, /chat/stream, /chat/batch endpoints</span></div>
</div></div>
<div class="card"><div class="card-title">Production Best Practices</div>
<div class="arch-row"><div class="arch-label">Caching</div><div class="arch-val">Exact same queries cache karo — Redis semantic cache. Cost aur latency dramatically kam.</div></div>
<div class="arch-row"><div class="arch-label">Rate Limiting</div><div class="arch-val">Per user API call limits. OpenAI rate limits handle karo — exponential backoff.</div></div>
<div class="arch-row"><div class="arch-label">Streaming</div><div class="arch-val">Response stream karo — UX improve hoti hai. FastAPI + SSE ya WebSocket.</div></div>
<div class="arch-row"><div class="arch-label">Fallbacks</div><div class="arch-val">Primary LLM fail hone pe backup use karo. <code>llm.with_fallbacks([backup_llm])</code></div></div>
<div class="arch-row"><div class="arch-label">Cost Control</div><div class="arch-val">Cheap model pehle try karo, complex queries pe expensive model. Token limits set karo.</div></div>
</div>
<div class="card"><div class="card-title">Cost Optimization</div>
<div class="cmd-block">
<div><span class="cmt"># Semantic caching — similar queries cache karo</span></div>
<div><span class="cmd">from</span> langchain.globals <span class="cmd">import</span> set_llm_cache</div>
<div><span class="cmd">from</span> langchain_community.cache <span class="cmd">import</span> RedisSemanticCache</div>
<div><span class="cmd">from</span> langchain_openai <span class="cmd">import</span> OpenAIEmbeddings</div>
<div>&nbsp;</div>
<div>set_llm_cache(RedisSemanticCache(</div>
<div>    redis_url=<span class="str">"redis://localhost:6379"</span>,</div>
<div>    embedding=OpenAIEmbeddings()</div>
<div>))</div>
<div>&nbsp;</div>
<div><span class="cmt"># Fallback chain</span></div>
<div>cheap_llm = ChatOpenAI(model=<span class="str">"gpt-4o-mini"</span>)</div>
<div>expensive_llm = ChatOpenAI(model=<span class="str">"gpt-4o"</span>)</div>
<div>smart_chain = cheap_llm.with_fallbacks([expensive_llm])</div>
</div></div>
<div class="q-section"><div class="q-title">Interview Questions</div><ol class="q-list">
<li>LangChain app ko production mein deploy karne ka architecture kya hoga?</li>
<li>LLM API costs control kaise karoge? Top 5 strategies kya hain?</li>
<li>Semantic caching kya hai? Regular caching se kaise alag hai?</li>
<li>LLM responses mein latency reduce karne ke techniques kya hain?</li>
<li>Multi-tenant LLM app mein isolation kaise ensure karoge?</li>
</ol></div>`},
